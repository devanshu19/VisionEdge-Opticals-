<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { padding-top: 80px; }
        .sidebar { background: white; border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-sm); height: 100%; min-height: calc(100vh - 120px); position: sticky; top: 100px;}
        .nav-pills .nav-link { color: var(--text-muted); border-radius: 8px; margin-bottom: 0.5rem; padding: 12px 16px; font-weight: 500; transition: all 0.3s; }
        .nav-pills .nav-link:hover { background: rgba(37,99,235,0.05); color: var(--primary-color); }
        .nav-pills .nav-link.active { background: var(--primary-color); color: white; box-shadow: var(--shadow-sm); }
        .nav-pills .nav-link i { width: 24px; text-align: center; margin-right: 8px; }
        
        .dash-card { background: white; border-radius: var(--border-radius); padding: 2rem; box-shadow: var(--shadow-sm); border: none; }
        
        .profile-img-wrapper { position: relative; width: 120px; height: 120px; margin: 0 auto 1.5rem; }
        .profile-img-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: var(--shadow-sm); }
        .upload-btn { position: absolute; bottom: 0; right: 0; width: 35px; height: 35px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; transition: transform 0.2s;}
        .upload-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-light">
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div class="row g-4">
            
            <!-- Sidebar -->
            <div class="col-lg-3">
                <div class="sidebar" data-aos="fade-right">
                    <div class="text-center mb-4 pb-4 border-bottom">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=2563EB&color=fff&size=80" class="rounded-circle mb-3 shadow-sm" alt="Profile">
                        <h5 class="fw-bold mb-1">John Doe</h5>
                        <p class="text-muted small mb-0">john.doe@example.com</p>
                    </div>
                    
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="orders.html"><i class="bi bi-box-seam"></i> My Orders</a></li>
                        <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="bi bi-file-medical"></i> Prescriptions</a></li>
                        <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="bi bi-heart"></i> Wishlist</a></li>
                        <li class="nav-item"><a class="nav-link" href="payment-history.html"><i class="bi bi-credit-card"></i> Payment History</a></li>
                        <li class="nav-item mt-3 pt-3 border-top"><a class="nav-link active" href="profile.html"><i class="bi bi-person"></i> Account Settings</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-lg-9">
                <div data-aos="fade-up">
                    <h2 class="fw-bold mb-4">Account Settings</h2>
                    
                    <div class="dash-card mb-4">
                        <h4 class="fw-bold mb-4 border-bottom pb-3">Personal Information</h4>
                        
                        <div class="text-center mb-4">
                            <div class="profile-img-wrapper">
                                <img src="https://ui-avatars.com/api/?name=John+Doe&background=2563EB&color=fff&size=200" alt="Profile">
                                <label for="photoUpload" class="upload-btn"><i class="bi bi-camera-fill"></i></label>
                                <input type="file" id="photoUpload" class="d-none" accept="image/*">
                            </div>
                            <p class="text-muted small">Allowed JPG, GIF or PNG. Max size of 800K</p>
                        </div>
                        
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">First Name</label>
                                    <input type="text" class="form-control" value="John" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Last Name</label>
                                    <input type="text" class="form-control" value="Doe" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Email Address</label>
                                    <input type="email" class="form-control" value="john.doe@example.com" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Phone Number</label>
                                    <input type="tel" class="form-control" value="+1 800 123 4567">
                                </div>
                                <div class="col-12 text-end mt-4">
                                    <button type="submit" class="btn btn-primary px-4 fw-bold">Save Changes</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="dash-card">
                        <h4 class="fw-bold mb-4 border-bottom pb-3">Change Password</h4>
                        <form>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold">Current Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold">New Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold">Confirm New Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="col-12 text-end mt-4">
                                    <button type="submit" class="btn btn-outline-primary px-4 fw-bold">Update Password</button>
                                </div>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
