<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <g transform="translate(100, 20)">
    <!-- High Curved Bridge -->
    <path d="M 160 115 Q 190 95 220 115" stroke="#94A3B8" stroke-width="5" fill="none"/>

    <!-- Left Round Rim -->
    <circle cx="110" cy="125" r="50" fill="rgba(56, 189, 248, 0.25)" stroke="#64748B" stroke-width="6"/>
    <path d="M 80 100 Q 110 90 135 110 Q 105 120 80 100 Z" fill="rgba(255, 255, 255, 0.3)"/>

    <!-- Right Round Rim -->
    <circle cx="270" cy="125" r="50" fill="rgba(56, 189, 248, 0.25)" stroke="#64748B" stroke-width="6"/>
    <path d="M 240 100 Q 270 90 295 110 Q 265 120 240 100 Z" fill="rgba(255, 255, 255, 0.3)"/>

    <!-- Temples -->
    <path d="M 60 120 Q 30 110 0 105" stroke="#64748B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 320 120 Q 350 110 380 105" stroke="#64748B" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
