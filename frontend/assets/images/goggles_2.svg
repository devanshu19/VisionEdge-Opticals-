<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#F8FAFC"/>
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F1F5F9"/>
  </radialGradient>
  <rect width="600" height="400" fill="url(#bgGlow)"/>

  <g transform="translate(100, 100)">
    <!-- Bridge -->
    <path d="M 175 80 Q 200 70 225 80" stroke="#0F172A" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Left Lens Rim -->
    <path d="M 60 70 L 175 75 C 180 120, 160 170, 120 175 C 75 180, 55 140, 60 70 Z" 
          fill="rgba(226, 232, 240, 0.4)" stroke="#0F172A" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 80 85 C 95 80, 130 85, 145 95 C 130 110, 95 105, 80 85 Z" fill="rgba(255, 255, 255, 0.6)"/>

    <!-- Right Lens Rim -->
    <path d="M 225 75 L 340 70 C 345 140, 325 180, 280 175 C 240 170, 220 120, 225 75 Z" 
          fill="rgba(226, 232, 240, 0.4)" stroke="#0F172A" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 255 95 C 270 85, 305 80, 320 85 C 305 105, 270 110, 255 95 Z" fill="rgba(255, 255, 255, 0.6)"/>

    <!-- Silver Hinge Studs -->
    <ellipse cx="68" cy="80" rx="4" ry="2" fill="#E2E8F0"/>
    <ellipse cx="332" cy="80" rx="4" ry="2" fill="#E2E8F0"/>

    <!-- Temples -->
    <path d="M 60 80 L 10 70 Q -5 65 -15 85" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 340 80 L 390 70 Q 405 65 415 85" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="300" y="340" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">Wayfarer Classic Matte Black Goggles</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Ray-Ban • Handcrafted Acetate Specs</text>
</svg>
