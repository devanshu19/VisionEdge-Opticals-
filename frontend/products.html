<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- MediaPipe dependencies for VTO -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=4">
    
    <!-- Theme Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('visionEdgeTheme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    
    <style>
        .page-header { background: var(--secondary-color); padding: 120px 0 40px; color: white; text-align: center; }
        
        .filter-sidebar { background: var(--card-bg); border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-sm); position: sticky; top: 100px;}
        .filter-title { font-weight: 700; margin-bottom: 1rem; color: var(--text-dark); font-size: 1.1rem; }
        .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        
        .product-card .card-img-top { height: 220px; object-fit: cover; padding: 1rem; background: #f1f5f9; transition: transform 0.3s; }
        .product-card:hover .card-img-top { transform: scale(1.05); }
        .product-badge { position: absolute; top: 15px; left: 15px; }
        .wishlist-btn { position: absolute; top: 15px; right: 15px; background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); box-shadow: var(--shadow-sm); transition: all 0.3s; z-index: 2;}
        .wishlist-btn:hover { color: var(--accent-color); transform: scale(1.1); }
        
        .color-dot { width: 20px; height: 20px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: var(--primary-color); padding: 2px; background-clip: content-box; }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>

    <header class="page-header">
        <div class="container">
            <h2 class="display-6 fw-bold mb-2" data-aos="fade-up">Shop All Products</h2>
            <nav aria-label="breadcrumb" data-aos="fade-up" data-aos-delay="100">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-white opacity-75 text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active text-white" aria-current="page">Products</li>
                </ol>
            </nav>
        </div>
    </header>

    <section class="py-5">
        <div class="container py-4">
            <div class="row g-4">
                
                <!-- Filters Sidebar -->
                <div class="col-lg-3" data-aos="fade-right">
                    <div class="filter-sidebar">
                        <h4 class="fw-bold mb-4 border-bottom pb-2">Filters</h4>
                        
                        <div class="mb-4">
                            <h5 class="filter-title">Categories</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input cat-checkbox" type="checkbox" id="cat1" value="Eyeglasses" checked>
                                <label class="form-check-label text-muted d-flex justify-content-between align-items-center" for="cat1">
                                    <span>Eyeglasses</span> <span class="badge bg-light text-dark rounded-pill">5</span>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input cat-checkbox" type="checkbox" id="cat2" value="Sunglasses" checked>
                                <label class="form-check-label text-muted d-flex justify-content-between align-items-center" for="cat2">
                                    <span>Sunglasses</span> <span class="badge bg-light text-dark rounded-pill">5</span>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input cat-checkbox" type="checkbox" id="cat3" value="Computer Glasses" checked>
                                <label class="form-check-label text-muted d-flex justify-content-between align-items-center" for="cat3">
                                    <span>Computer Glasses</span> <span class="badge bg-light text-dark rounded-pill">5</span>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input cat-checkbox" type="checkbox" id="cat4" value="Kids Glasses" checked>
                                <label class="form-check-label text-muted d-flex justify-content-between align-items-center" for="cat4">
                                    <span>Kids Glasses</span> <span class="badge bg-light text-dark rounded-pill">5</span>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input cat-checkbox" type="checkbox" id="cat5" value="Contact & Optical Lenses" checked>
                                <label class="form-check-label text-muted d-flex justify-content-between align-items-center" for="cat5">
                                    <span>Contact &amp; Lenses</span> <span class="badge bg-light text-dark rounded-pill">5</span>
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5 class="filter-title">Price Range</h5>
                            <input type="range" class="form-range" min="0" max="5000" step="100" value="5000" id="priceRange">
                            <div class="d-flex justify-content-between text-muted small">
                                <span>₹0</span>
                                <span id="priceDisplay">₹5,000+</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5 class="filter-title">Frame Shape</h5>
                            <div class="d-flex flex-wrap gap-2" id="shapeFilterContainer">
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Aviator</button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Rectangle</button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Round</button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Wayfarer</button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Cat-Eye</button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill shape-btn">Square</button>
                            </div>
                        </div>

                        <button id="applyFiltersBtn" class="btn btn-primary w-100 fw-bold">Apply Filters</button>
                    </div>
                </div>

                <!-- Product Grid -->
                <div class="col-lg-9">
                    <!-- Category Quick Tabs -->
                    <div class="d-flex flex-wrap gap-2 mb-4" id="categoryNavTabs">
                        <button class="btn btn-primary btn-sm rounded-pill px-3 cat-tab-btn active" data-cat="All" onclick="window.filterByCategory('All', this)">All Categories (25)</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 cat-tab-btn" data-cat="Eyeglasses" onclick="window.filterByCategory('Eyeglasses', this)">Eyeglasses (5)</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 cat-tab-btn" data-cat="Sunglasses" onclick="window.filterByCategory('Sunglasses', this)">Sunglasses (5)</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 cat-tab-btn" data-cat="Computer Glasses" onclick="window.filterByCategory('Computer Glasses', this)">Computer Glasses (5)</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 cat-tab-btn" data-cat="Kids Glasses" onclick="window.filterByCategory('Kids Glasses', this)">Kids Glasses (5)</button>
                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 cat-tab-btn" data-cat="Contact & Optical Lenses" onclick="window.filterByCategory('Contact & Optical Lenses', this)">Contact &amp; Lenses (5)</button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <p class="text-muted mb-0" id="productCount">Loading products...</p>
                        <select class="form-select shadow-sm border-0" id="sortSelect" style="min-width: 220px; padding: 10px 38px 10px 16px; border-radius: 12px; font-weight: 600;">
                            <option value="recommended">Sort by: Recommended</option>
                            <option value="low-high">Price: Low to High</option>
                            <option value="high-low">Price: High to Low</option>
                            <option value="newest">Newest Arrivals</option>
                        </select>
                    </div>

                    <div class="row g-4" id="productsContainer">
                        <!-- Products will be dynamically loaded here by products.js -->
                    </div>
                    
                    <!-- Pagination -->
                    <nav class="mt-5" aria-label="Page navigation" data-aos="fade-up">
                        <ul class="pagination justify-content-center">
                            <li class="page-item disabled"><a class="page-link border-0 shadow-sm rounded-start-pill px-3" href="#">Previous</a></li>
                            <li class="page-item active"><a class="page-link border-0 shadow-sm" href="#">1</a></li>
                            <li class="page-item"><a class="page-link border-0 shadow-sm" href="#">2</a></li>
                            <li class="page-item"><a class="page-link border-0 shadow-sm" href="#">3</a></li>
                            <li class="page-item"><a class="page-link border-0 shadow-sm rounded-end-pill px-3" href="#">Next</a></li>
                        </ul>
                    </nav>

                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>
    
    <!-- VTO Modal -->
    <div class="modal fade" id="vtoModal" tabindex="-1" aria-labelledby="vtoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background: var(--card-bg, #fff); color: var(--text-main, #333);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="vtoModalLabel"><i class="bi bi-magic text-primary me-2"></i>Virtual Try-On</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="vto-container position-relative overflow-hidden rounded shadow-sm mx-auto bg-black" style="max-width: 640px; aspect-ratio: 4/3;">
                        <video id="vtoVideo" autoplay playsinline class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; transform: scaleX(-1);"></video>
                        <canvas id="vtoCanvas" class="position-absolute top-0 start-0 w-100 h-100" style="transform: scaleX(-1); z-index: 10;"></canvas>
                        
                        <div id="vtoLoadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-black bg-opacity-75 text-white" style="z-index: 20;">
                            <div class="spinner-border text-light mb-3" role="status"></div>
                            <h5>Initializing AR Engine...</h5>
                            <p class="small text-white-50">Please allow camera access.</p>
                        </div>
                    </div>
                    <div class="mt-3" id="vtoFrameInfo">
                        <!-- Populated by JS -->
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 justify-content-center">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                    <!-- <button type="button" class="btn btn-primary rounded-pill px-4" id="vtoSnapshotBtn"><i class="bi bi-camera me-2"></i>Snapshot</button> -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js?v=999"></script>
    <script src="assets/js/cart.js?v=999"></script>
    <script src="assets/js/products.js?v=999"></script>
    <script src="assets/js/vto-customer.js?v=999"></script>
</body>
</html>
