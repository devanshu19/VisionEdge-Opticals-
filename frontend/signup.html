<!-- SIGNUP JAVASCRIPT -->

<script>

    const API_BASE_URL = "http://127.0.0.1:5000/api";


    /*
    ==========================================
    SHOW MESSAGE
    ==========================================
    */

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("messageBox");

        messageBox.className =
            "alert alert-" + type;

        messageBox.textContent =
            message;

        messageBox.style.display =
            "block";

    }


    /*
    ==========================================
    TOGGLE PASSWORD
    ==========================================
    */

    function togglePassword(inputId, iconId) {

        const input =
            document.getElementById(inputId);

        const icon =
            document.getElementById(iconId);

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }


    /*
    ==========================================
    SIGNUP FORM
    ==========================================
    */

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            /*
            GET FORM VALUES
            */

            const firstName =
                document
                    .getElementById("firstName")
                    .value
                    .trim();

            const lastName =
                document
                    .getElementById("lastName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            const gender =
                document
                    .getElementById("gender")
                    .value;

            const dateOfBirth =
                document
                    .getElementById("dateOfBirth")
                    .value;

            const address =
                document
                    .getElementById("address")
                    .value
                    .trim();


            /*
            ==========================================
            VALIDATE PASSWORD
            ==========================================
            */

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "danger"
                );

                return;

            }


            /*
            ==========================================
            CREATE USERNAME
            ==========================================

            Backend requires username.

            We create it automatically
            from first and last name.

            Example:

            Rahul Patel
            becomes:

            rahul.patel

            ==========================================
            */

            const username =
                (
                    firstName +
                    "." +
                    lastName
                )
                .toLowerCase()
                .replace(/\s+/g, "")
                .replace(/[^a-z0-9.]/g, "");


            /*
            ==========================================
            SHOW LOADING
            ==========================================
            */

            document
                .getElementById("signupButton")
                .disabled = true;

            document
                .getElementById("buttonText")
                .style.display = "none";

            document
                .getElementById("loadingSpinner")
                .style.display = "inline";


            try {

                /*
                ==========================================
                SEND DATA TO FLASK BACKEND
                ==========================================
                */

                const response =
                    await fetch(
                        API_BASE_URL + "/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    username,

                                first_name:
                                    firstName,

                                last_name:
                                    lastName,

                                email:
                                    email,

                                phone:
                                    phone,

                                password:
                                    password,

                                gender:
                                    gender,

                                date_of_birth:
                                    dateOfBirth,

                                address:
                                    address

                            })

                        }
                    );


                const data =
                    await response.json();


                /*
                ==========================================
                HANDLE ERROR
                ==========================================
                */

                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Registration failed.",
                        "danger"
                    );

                    return;

                }


                /*
                ==========================================
                SAVE LOGGED-IN USER DATA
                ==========================================
                */

                if (data.access_token) {

                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );

                }


                if (data.user) {

                    localStorage.setItem(
                        "current_user",
                        JSON.stringify(data.user)
                    );

                }


                /*
                ==========================================
                SUCCESS
                ==========================================
                */

                showMessage(
                    "Account created successfully! Redirecting...",
                    "success"
                );


                /*
                REDIRECT TO DASHBOARD
                */

                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(
                    "Signup Error:",
                    error
                );


                showMessage(
                    "Unable to connect to the VisionEdge server. Please make sure the backend is running.",
                    "danger"
                );


            } finally {

                /*
                RESTORE BUTTON
                */

                document
                    .getElementById("signupButton")
                    .disabled = false;

                document
                    .getElementById("buttonText")
                    .style.display = "inline";

                document
                    .getElementById("loadingSpinner")
                    .style.display = "none";

            }

        });

</script>
