<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Optical Assistant - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .chat-card { height: 75vh; display: flex; flex-direction: column; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .chat-body { flex: 1; overflow-y: auto; padding: 1.5rem; background: #f8f9fa; }
        .msg-bubble { max-width: 75%; border-radius: 16px; padding: 12px 18px; margin-bottom: 1rem; font-size: 0.95rem; }
        .msg-user { background: var(--primary-color); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg-ai { background: white; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4" data-aos="fade-down">
                    <div class="mb-3 mb-md-0">
                        <h2 class="mb-0 fw-bold"><i class="bi bi-robot text-primary me-2"></i>AI Optical Assistant</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Home</a></li>
                                <li class="breadcrumb-item active" aria-current="page">AI Chat</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <div class="chat-card" data-aos="fade-up">
                    <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="position-relative me-3">
                                <div class="bg-primary text-white rounded-circle p-2 fs-5"><i class="bi bi-eyeglasses"></i></div>
                                <span class="position-absolute bottom-0 end-0 bg-success border border-white rounded-circle p-1"></span>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0">VisionEdge AI Copilot</h6>
                                <small class="text-success"><i class="bi bi-circle-fill me-1 small"></i>Online • Inventory & Rx Expert</small>
                            </div>
                        </div>
                    </div>

                    <div class="chat-body" id="chatMessages">
                        <div class="msg-bubble msg-ai shadow-sm">
                            👋 Hello! I am your AI Optical Assistant. Ask me anything about store inventory, prescription lens coatings, customer lookup, or frame recommendations!
                        </div>
                    </div>

                    <div class="card-footer bg-white p-3 border-top">
                        <form id="aiChatForm">
                            <div class="input-group">
                                <input type="text" class="form-control" id="chatInput" placeholder="Ask AI (e.g. Recommend blue-cut progressive lenses for high cylinder Rx...)" required>
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send-fill me-1"></i>Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="footer-container"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/ai-chat.js"></script>
</body>
</html>
