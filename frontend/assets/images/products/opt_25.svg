<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(300, 180)">
    <rect x="-120" y="-85" width="240" height="160" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-120" y="-85" width="240" height="50" rx="20" fill="#475569"/>
    <rect x="-120" y="-55" width="240" height="20" fill="#475569"/>
    <text x="0" y="-54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VISIONEDGE OPTICAL LENS</text>
    <circle cx="0" cy="22" r="44" fill="url(#lensGrad)" stroke="#475569" stroke-width="3"/>
    <ellipse cx="-14" cy="8" rx="16" ry="9" fill="#ffffff" opacity="0.6" transform="rotate(-30 -14 8)"/>
    <text x="0" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Transitions Gen8 Photochromi</text>
  </g>
