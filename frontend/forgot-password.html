<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: url('https://images.unsplash.com/photo-1556761175-4b46a572b786?w=1600&q=80') center/cover no-repeat; min-height: 100vh; display: flex; flex-direction: column; }
        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 0; }
        
        .auth-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 100px 0 60px; position: relative; z-index: 10; }
        
        .auth-card { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); border-radius: var(--border-radius-lg); padding: 3rem; box-shadow: var(--shadow-lg); width: 100%; max-width: 450px; }
        
        .auth-card .form-control { background: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.5); }
        .auth-card .form-control:focus { background: white; border-color: var(--primary-color); }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>

    <div class="auth-overlay"></div>
    
    <div class="container auth-container">
        <div class="auth-card" data-aos="zoom-in">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock fs-1 text-primary mb-2"></i>
                <h2 class="fw-bold">Reset Password</h2>
                <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            
            <form id="resetForm">
                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Email Address</label>
                    <input type="email" class="form-control form-control-lg" placeholder="name@example.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-4 shadow">Send Reset Link</button>
                
                <p class="text-center text-muted small mb-0"><i class="bi bi-arrow-left me-1"></i> Back to <a href="login.html" class="fw-bold text-decoration-none">Login</a></p>
            </form>
            
            <!-- Success Message -->
            <div id="successMsg" class="text-center d-none">
                <i class="bi bi-envelope-check text-success fs-1 mb-2"></i>
                <h4 class="fw-bold">Email Sent!</h4>
                <p class="text-muted small mb-4">If an account exists for that email, a reset link has been sent.</p>
                <a href="login.html" class="btn btn-outline-primary w-100 fw-bold">Return to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            this.classList.add('d-none');
            document.getElementById('successMsg').classList.remove('d-none');
        });
    </script>
</body>
</html>
