<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prescriptions - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=8">
    <style>
        body { padding-top: 80px; }
        .sidebar { background: white; border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-sm); height: 100%; min-height: calc(100vh - 120px); position: sticky; top: 100px;}
        .sidebar-avatar-ring {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; font-size: 1.8rem; color: white; font-weight: 700;
            box-shadow: 0 4px 12px rgba(37,99,235,0.25);
        }
        .nav-pills .nav-link { color: var(--text-muted); border-radius: 8px; margin-bottom: 0.5rem; padding: 12px 16px; font-weight: 500; transition: all 0.3s; }
        .nav-pills .nav-link:hover { background: rgba(37,99,235,0.05); color: var(--primary-color); }
        .nav-pills .nav-link.active { background: var(--primary-color); color: white; box-shadow: var(--shadow-sm); }
        .nav-pills .nav-link i { width: 24px; text-align: center; margin-right: 8px; }
        
        .dash-card { background: white; border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-sm); border: none; }
        .rx-table th { background-color: #f8fafc; color: var(--secondary-color); font-weight: 600; font-size: 0.85rem;}
        .rx-table td { font-family: monospace; font-size: 1.05rem;}
    </style>
</head>
<body class="bg-light">
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div class="row g-4">
            
            <div class="col-lg-3">
                <div class="sidebar" data-aos="fade-right">
                    <div class="text-center mb-4 pb-4 border-bottom">
                        <div id="dashAvatarRing" class="sidebar-avatar-ring">U</div>
                        <h5 id="dashName" class="fw-bold mb-1">Loading...</h5>
                        <p id="dashEmail" class="text-muted small mb-0">...</p>
                    </div>
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="orders.html"><i class="bi bi-box-seam"></i> My Orders</a></li>
                        <li class="nav-item"><a class="nav-link active" href="prescriptions.html"><i class="bi bi-file-medical"></i> Prescriptions</a></li>
                        <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="bi bi-heart"></i> Wishlist</a></li>
                        <li class="nav-item"><a class="nav-link" href="payment-history.html"><i class="bi bi-credit-card"></i> Payment History</a></li>
                        <li class="nav-item mt-3 pt-3 border-top"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Account Settings</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
            
            <div class="col-lg-9">
                <div data-aos="fade-up">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold mb-0">My Prescriptions</h2>
                        <a href="eye-test.html" class="btn btn-primary fw-bold shadow-sm"><i class="bi bi-calendar-plus me-2"></i>Book Eye Exam</a>
                    </div>
                    
                    <div id="rxListContainer">
                        <div class="text-center py-5 text-muted">
                            <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
                            <p class="small mb-0">Loading prescriptions...</p>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem('jwtToken') || localStorage.getItem('access_token') || sessionStorage.getItem('jwtToken');
            const userStr = localStorage.getItem('user') || localStorage.getItem('current_user') || sessionStorage.getItem('user');

            if (!token || !userStr) {
                window.location.href = 'login.html';
                return;
            }

            let user = {};
            try { user = JSON.parse(userStr); } catch (e) {}

            const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.name || user.username || 'Customer';
            const initials = ((user.first_name || user.name || 'U')[0]).toUpperCase();

            document.getElementById('dashAvatarRing').textContent = initials;
            document.getElementById('dashName').textContent = fullName;
            document.getElementById('dashEmail').textContent = user.email || '';

            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                ['jwtToken','access_token','user','current_user','visionEdgeCart','cart'].forEach(k => {
                    localStorage.removeItem(k);
                    sessionStorage.removeItem(k);
                });
                window.location.href = 'login.html';
            });

            const API_BASE = window.API_BASE_URL || 'http://127.0.0.1:5000/api';
            const container = document.getElementById('rxListContainer');

            try {
                const res = await fetch(`${API_BASE}/prescriptions/my-prescriptions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (res.ok) {
                    const rxList = await res.json();
                    renderPrescriptions(rxList);
                } else {
                    renderEmptyRx();
                }
            } catch (err) {
                console.warn('Prescriptions fetch error:', err);
                renderEmptyRx();
            }
        });

        function renderPrescriptions(list) {
            const container = document.getElementById('rxListContainer');
            if (!list || list.length === 0) {
                renderEmptyRx();
                return;
            }

            let html = '';
            list.forEach((rx, idx) => {
                const od = rx.od || {};
                const os = rx.os || {};
                html += `
                <div class="dash-card mb-4" data-aos="fade-up" data-aos-delay="${idx * 80}">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <div>
                            <h5 class="fw-bold text-secondary mb-1">Prescription #${rx.prescription_number || rx.id}</h5>
                            <p class="text-muted small mb-0"><i class="bi bi-person-badge me-1"></i>${rx.doctor_name || 'Optometrist'} &bull; Issued on ${rx.date || 'Recent'}</p>
                        </div>
                        <span class="badge ${rx.status === 'Completed' || rx.status === 'Active' ? 'bg-success' : 'bg-secondary'}">${rx.status || 'Active'}</span>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-bordered text-center rx-table mb-0">
                            <thead>
                                <tr>
                                    <th>EYE</th>
                                    <th>SPH (Sphere)</th>
                                    <th>CYL (Cylinder)</th>
                                    <th>AXIS</th>
                                    <th>ADD</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="fw-bold bg-light">OD (Right)</td>
                                    <td>${od.sph || '0.00'}</td>
                                    <td>${od.cyl || '0.00'}</td>
                                    <td>${od.axis || '0'}&deg;</td>
                                    <td>${od.add || '0.00'}</td>
                                </tr>
                                <tr>
                                    <td class="fw-bold bg-light">OS (Left)</td>
                                    <td>${os.sph || '0.00'}</td>
                                    <td>${os.cyl || '0.00'}</td>
                                    <td>${os.axis || '0'}&deg;</td>
                                    <td>${os.add || '0.00'}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="text-muted small"><strong>PD (Pupillary Distance):</strong> ${od.pd || os.pd || '63'} mm</div>
                        <a href="products.html" class="btn btn-outline-primary btn-sm fw-bold px-3">
                            <i class="bi bi-eyeglasses me-1"></i> Order Glasses with this Prescription
                        </a>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function renderEmptyRx() {
            const container = document.getElementById('rxListContainer');
            container.innerHTML = `
                <div class="dash-card text-center py-5">
                    <i class="bi bi-file-earmark-medical fs-1 text-primary opacity-50 d-block mb-3"></i>
                    <h5 class="fw-bold text-dark mb-1">No Prescriptions Saved Yet</h5>
                    <p class="text-muted small mb-4">When you get an eye examination or upload a prescription slip, your verified optical power parameters will appear here.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="eye-test.html" class="btn btn-primary px-4 fw-bold rounded-pill">
                            <i class="bi bi-calendar-plus me-1"></i> Book Eye Test
                        </a>
                        <a href="products.html" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">
                            <i class="bi bi-shop me-1"></i> Browse Frames
                        </a>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
