<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="faceShade" cx="50%" cy="40%" r="50%">
      <stop offset="60%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>

  <g transform="translate(0, 20)">
    <!-- Shoulders & Shirt -->
    <path d="M 170 440 Q 320 380 470 440 L 510 480 L 130 480 Z" fill="#1E3A8A"/>
    <path d="M 270 380 Q 320 420 370 380 L 370 480 L 270 480 Z" fill="#FFFFFF"/>

    <!-- Neck -->
    <rect x="280" y="300" width="80" height="90" rx="15" fill="#EAB308"/>

    <!-- Head & Face Shape -->
    <ellipse cx="320" cy="210" rx="115" ry="145" fill="url(#faceShade)" stroke="#D97706" stroke-width="2"/>

    <!-- Hair -->
    <path d="M 205 180 Q 210 90 320 85 Q 430 90 435 180 Q 400 110 320 110 Q 240 110 205 180 Z" fill="#1E293B"/>

    <!-- Eyebrows -->
    <path d="M 235 170 Q 265 160 295 170" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 345 170 Q 375 160 405 170" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Positioned for Spectacles Try-on at Y=195) -->
    <!-- Left Eye -->
    <ellipse cx="265" cy="195" rx="22" ry="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <circle cx="265" cy="195" r="9" fill="#1E293B"/>
    <circle cx="262" cy="192" r="3" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="375" cy="195" rx="22" ry="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <circle cx="375" cy="195" r="9" fill="#1E293B"/>
    <circle cx="372" cy="192" r="3" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 320 190 L 315 245 Q 320 252 325 245 Z" fill="#CA8A04" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/>

    <!-- Mouth / Smile -->
    <path d="M 275 280 Q 320 310 365 280" stroke="#991B1B" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Ears -->
    <ellipse cx="200" cy="215" rx="14" ry="25" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
    <ellipse cx="440" cy="215" rx="14" ry="25" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
  </g>
</svg>
