<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background-color: #f8f9fa; }
        .checkout-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #fff;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>
    
    <main class="container py-5 mt-5">
        <div class="row mb-4">
            <div class="col-12 text-center" data-aos="fade-down">
                <h1 class="fw-bold text-accent">Secure Checkout</h1>
                <p class="text-muted">Complete your purchase and an invoice will be generated instantly.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Shipping & Payment -->
            <div class="col-lg-8" data-aos="fade-right">
                <div class="checkout-card p-4 mb-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-geo-alt-fill text-primary me-2"></i>Shipping Information</h4>
                    <form id="checkoutForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">First Name</label>
                                <input type="text" class="form-control" id="co_firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Last Name</label>
                                <input type="text" class="form-control" id="co_lastName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Email</label>
                                <input type="email" class="form-control" id="co_email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Phone</label>
                                <input type="tel" class="form-control" id="co_phone" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small fw-bold">Shipping Address</label>
                                <textarea class="form-control" id="co_address" rows="3" required></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="checkout-card p-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-shield-check text-primary me-2"></i>Select Payment Method</h4>
                    <div class="d-flex flex-column gap-3">
                        <!-- Razorpay Secure Payment (Primary) -->
                        <div class="border rounded p-3 border-primary border-opacity-50 bg-light bg-opacity-25 shadow-sm">
                            <label class="form-check d-flex align-items-start mb-0" style="cursor:pointer">
                                <input class="form-check-input me-3 ms-1 mt-1" type="radio" name="paymentMethod" value="Razorpay" checked onchange="handlePaymentMethodChange()">
                                <div class="w-100">
                                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                        <h6 class="mb-0 fw-bold text-dark">
                                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Razorpay Secure Checkout
                                            <span class="badge bg-success-subtle text-success border border-success-subtle ms-2" style="font-size:0.75rem;">Instant & Verified</span>
                                        </h6>
                                        <div class="d-flex align-items-center gap-1">
                                            <span class="badge bg-white text-dark border" style="font-size:0.7rem;">UPI</span>
                                            <span class="badge bg-white text-dark border" style="font-size:0.7rem;">Cards</span>
                                            <span class="badge bg-white text-dark border" style="font-size:0.7rem;">NetBanking</span>
                                            <span class="badge bg-white text-dark border" style="font-size:0.7rem;">Wallets</span>
                                        </div>
                                    </div>
                                    <p class="text-muted small mb-2 mt-1">
                                        Pay securely via Google Pay, PhonePe, Paytm, Any UPI, Credit/Debit Card (Visa, MasterCard, RuPay), NetBanking, or Cred.
                                    </p>
                                    <div class="p-2 rounded bg-white border border-light-subtle d-flex align-items-center gap-2 small text-muted">
                                        <i class="bi bi-shield-lock-fill text-primary fs-5"></i>
                                        <span>256-bit bank-grade encryption powered by <strong>Razorpay Standard Checkout</strong>. Your card details are never saved on our servers.</span>
                                    </div>
                                </div>
                            </label>
                        </div>

                        <!-- Cash on Delivery -->
                        <div class="border rounded p-3">
                            <label class="form-check d-flex align-items-center mb-0" style="cursor:pointer">
                                <input class="form-check-input me-3 ms-1" type="radio" name="paymentMethod" value="Cash on Delivery" onchange="handlePaymentMethodChange()">
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark"><i class="bi bi-cash-stack text-success me-2"></i>Cash on Delivery (COD)</h6>
                                    <small class="text-muted">Pay at doorstep with cash or delivery agent QR upon receiving your order.</small>
                                </div>
                            </label>
                        </div>

                        <!-- Optional PayU Sandbox Fallback -->
                        <div class="border rounded p-3">
                            <label class="form-check d-flex align-items-center mb-0" style="cursor:pointer">
                                <input class="form-check-input me-3 ms-1" type="radio" name="paymentMethod" value="PayU Sandbox" onchange="handlePaymentMethodChange()">
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark"><i class="bi bi-box-arrow-up-right text-info me-2"></i>PayU Payment Gateway (Sandbox Alternate)</h6>
                                    <small class="text-muted">Redirect to PayU sandbox hosted checkout.</small>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Order Summary -->
            <div class="col-lg-4" data-aos="fade-left" data-aos-delay="100">
                <div class="checkout-card p-4 sticky-top" style="top: 100px;">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    
                    <div id="checkoutItemsList" class="mb-4" style="max-height: 300px; overflow-y: auto;">
                        <!-- JS renders items here -->
                    </div>
                    
                    <!-- Coupon Code Input Box -->
                    <div class="mb-3 pt-2">
                        <label class="form-label small text-muted fw-bold mb-1">HAVE A COUPON / PROMO CODE?</label>
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control text-uppercase fw-bold" id="couponCodeInput" placeholder="e.g. VISION30, BOGO2026">
                            <button class="btn btn-outline-primary fw-bold" type="button" id="btnApplyCoupon" onclick="applyCouponCode()">Apply</button>
                        </div>
                        <div id="couponFeedback" class="small mt-1"></div>
                    </div>

                    <div class="border-top pt-3 mb-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span class="fw-bold" id="co_subtotal">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 d-none" id="couponDiscountRow">
                            <span class="text-success fw-bold"><i class="bi bi-tag-fill me-1"></i>Discount (<span id="appliedCouponBadge"></span>)</span>
                            <span class="fw-bold text-success" id="co_discount">-₹0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Shipping</span>
                            <span class="fw-bold text-success">Free</span>
                        </div>
                        <div class="d-flex justify-content-between fs-5 border-top pt-3 mt-3">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold text-primary" id="co_total">₹0</span>
                        </div>
                    </div>
                    
                    <!-- PayU Pay Button -->
                    <button class="btn w-100 py-3 rounded-3 fw-bold shadow" id="btnPlaceOrder"
                        style="background:linear-gradient(135deg,#6c63ff,#3b5bdb);color:#fff;border:none;font-size:1rem;letter-spacing:.5px;">
                        <i class="bi bi-lock-fill me-2"></i>Pay Securely with Razorpay
                    </button>

                    <!-- Security badges -->
                    <div class="d-flex justify-content-center align-items-center gap-2 mt-3 flex-wrap">
                        <span class="badge bg-light text-dark border" style="font-size:.7rem;">
                            <i class="bi bi-shield-lock-fill text-success me-1"></i>SSL Secured
                        </span>
                        <span class="badge bg-light text-dark border" style="font-size:.7rem;">
                            <i class="bi bi-bank text-primary me-1"></i>PCI-DSS
                        </span>
                        <span class="badge bg-light text-dark border" style="font-size:.7rem;">
                            <i class="bi bi-patch-check-fill text-warning me-1"></i>RBI Compliant
                        </span>
                    </div>
                    <p class="text-center mt-2 mb-0" style="font-size:.7rem;color:#bbb;">
                        Powered by <strong>Razorpay</strong> & RBI Compliant
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({duration: 800, once: true});</script>
    
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
