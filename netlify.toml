# ==============================================================================
# Netlify Configuration for VisionEdge Opticals
# ==============================================================================

[build]
  # Directory to publish containing index.html and static assets
  publish = "frontend"
  command = ""

# Route API requests to production Render Flask backend
[[redirects]]
  from = "/api/*"
  to = "https://visionedge-opticals.onrender.com/api/:splat"
  status = 200
  force = true

# Custom Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
