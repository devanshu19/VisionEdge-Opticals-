<!-- Floating Chatbot Widget -->
<div id="ai-chatbot-widget" class="chatbot-widget position-fixed bottom-0 end-0 m-4" style="z-index: 1050; display: none;">
    <!-- Chat Icon Button -->
    <button id="chatbot-toggle-btn" class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; transition: transform 0.3s;">
        <i class="bi bi-robot fs-3"></i>
    </button>

    <!-- Chat Window -->
    <div id="chatbot-window" class="card shadow-lg border-0 d-none" style="width: 350px; height: 500px; position: absolute; bottom: 70px; right: 0; border-radius: 12px; overflow: hidden; flex-direction: column;">
        
        <!-- Header -->
        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center border-0">
            <div class="d-flex align-items-center">
                <i class="bi bi-robot fs-4 me-2"></i>

            <button id="chatbot-close-btn" class="btn btn-sm btn-link text-white p-0"><i class="bi bi-x-lg"></i></button>
        </div>
        
        <!-- Messages Area -->
        <div id="chatbot-messages" class="card-body bg-light p-3 overflow-auto" style="flex: 1;">

            <div class="d-flex mb-3">
                <div class="bg-white p-2 rounded shadow-sm" style="max-width: 85%; font-size: 0.9rem;">

            </div>
        </div>
        
        <!-- Input Area -->
        <div class="card-footer bg-white border-top p-2">
            <div class="input-group">

        </div>
