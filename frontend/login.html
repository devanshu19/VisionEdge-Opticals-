<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Customer Login - VisionEdge Opticals</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- VisionEdge CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=9">

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1556761175-4b46a572b786?w=1600&q=80') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 460px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }

        .password-toggle-btn {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            border-left: none;
            background-color: #ffffff;
        }
    </style>
</head>

<body>
<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
</div>

<!-- Navbar -->
<div id="navbar-container"></div>

<!-- Background Overlay -->
<div class="auth-overlay"></div>

<!-- Login Container -->
<div class="container auth-container">
    <div class="auth-card" data-aos="zoom-in">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small mb-0">Sign in to your VisionEdge optical account</p>
        </div>

        <!-- Global Alert Message -->
        <div id="loginMessage" class="alert d-none py-2 small mb-3" role="alert"></div>

        <!-- Simple Email + Password Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <!-- Email Input -->
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary" for="emailInput">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-envelope-at"></i></span>
                    <input type="email" class="form-control form-control-lg" id="emailInput" name="email" placeholder="name@example.com" autocomplete="email" required>
                </div>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-bold small text-secondary mb-0" for="pwdInput">Password</label>
                    <a href="forgot-password.html" class="small text-decoration-none fw-semibold">Forgot Password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control form-control-lg" placeholder="Enter password" id="pwdInput" name="password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" id="togglePasswordBtn" title="Show or hide password">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me -->
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label text-muted small fw-medium" for="rememberMe">Remember me on this device</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3 shadow" id="loginBtn">
                <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-1" role="status"></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="position-relative text-center my-3">
            <hr class="text-muted">
            <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted bg-white">OR</span>
        </div>

        <!-- Signup Link -->
        <p class="text-center text-muted small mb-0">
            Don't have an account?
            <a href="signup.html" class="fw-bold text-decoration-none text-primary">Create an Account</a>
        </p>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS JS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<!-- VisionEdge App & Auth JS -->
<script src="assets/js/api-config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (typeof AOS !== "undefined") {
            AOS.init({ duration: 800, once: true });
        }

        // Show/Hide Password Toggle
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const pwdInput = document.getElementById("pwdInput");
        const eyeIcon = document.getElementById("eyeIcon");
        if (toggleBtn && pwdInput && eyeIcon) {
            toggleBtn.addEventListener("click", function () {
                if (pwdInput.type === "password") {
                    pwdInput.type = "text";
                    eyeIcon.className = "bi bi-eye-slash";
                } else {
                    pwdInput.type = "password";
                    eyeIcon.className = "bi bi-eye";
                }
            });
        }
    });

    function showLoginMessage(msg, type = "danger") {
        const el = document.getElementById("loginMessage");
        el.className = `alert alert-${type} py-2 small mb-3`;
        el.textContent = msg;
        el.classList.remove("d-none");
    }

    function hideLoginMessage() {
        document.getElementById("loginMessage").classList.add("d-none");
    }

    // ==========================================
    // SIMPLE LOGIN HANDLER
    // ==========================================
    window.handleLogin = async function (e) {
        e.preventDefault();
        hideLoginMessage();

        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("pwdInput").value;
        const rememberMe = document.getElementById("rememberMe").checked;

        if (!email || !password) {
            showLoginMessage("Please enter both email address and password.", "warning");
            return;
        }

        const btn = document.getElementById("loginBtn");
        const spinner = document.getElementById("loginSpinner");
        const text = document.getElementById("loginBtnText");

        btn.disabled = true;
        spinner.classList.remove("d-none");
        text.innerHTML = "Signing in...";

        try {
            const apiUrl = window.API_BASE_URL || 'http://127.0.0.1:5000/api';
            const res = await fetch(`${apiUrl}/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await res.json();
            if (!res.ok) {
                showLoginMessage(data.message || "Invalid email or password.", "danger");
                return;
            }

            if (data.access_token) {
                if (typeof setAuthData === 'function') {
                    setAuthData(data.access_token, data.user, rememberMe);
                } else {
                    const storage = rememberMe ? localStorage : sessionStorage;
                    storage.setItem("access_token", data.access_token);
                    storage.setItem("jwtToken", data.access_token);
                    storage.setItem("current_user", JSON.stringify(data.user));
                    storage.setItem("user", JSON.stringify(data.user));
                }

                showLoginMessage("Login successful! Redirecting...", "success");

                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');

                    const userRole = (data.user && data.user.role) ? data.user.role.toLowerCase() : 'customer';
                    if (userRole === 'admin' || userRole === 'staff') {
                        window.location.href = redirectUrl || "admin/index.html";
                    } else {
                        window.location.href = redirectUrl || "dashboard.html";
                    }
                }, 600);
            }
        } catch (err) {
            console.error("Login network error:", err);
            showLoginMessage("Unable to connect to VisionEdge server. Please verify your connection.", "danger");
        } finally {
            btn.disabled = false;
            spinner.classList.add("d-none");
            text.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
        }
    };
</script>
</body>
</html>
