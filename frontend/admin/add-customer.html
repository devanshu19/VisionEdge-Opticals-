<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <!-- Page Header -->
                <div class="d-flex align-items-center mb-4" data-aos="fade-down">
                    <a href="customers.html" class="btn btn-link text-main p-0 me-3 fs-4"><i class="bi bi-arrow-left"></i></a>
                    <div>
                        <h2 class="mb-0 fw-bold">Add New Customer</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Home</a></li>
                                <li class="breadcrumb-item"><a href="customers.html" class="text-decoration-none text-muted">Customers</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Add Customer</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="row" data-aos="fade-up" data-aos-delay="100">
                    <div class="col-12 col-xl-9">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4 p-md-5">
                                <form id="addCustomerForm" class="needs-validation" novalidate>
                                    
                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Personal Information</h5>
                                    <div class="row g-4 mb-4">
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                                                <label for="firstName"><i class="bi bi-person me-2"></i>First Name *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                                                <label for="lastName"><i class="bi bi-person me-2"></i>Last Name *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <select class="form-select" id="gender" required>
                                                    <option value="" selected disabled>Select Gender</option>
                                                    <option value="Male">Male</option>
                                                    <option value="Female">Female</option>
                                                    <option value="Other">Other</option>
                                                </select>
                                                <label for="gender"><i class="bi bi-gender-ambiguous me-2"></i>Gender *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="date" class="form-control" id="dob">
                                                <label for="dob"><i class="bi bi-calendar me-2"></i>Date of Birth</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="occupation" placeholder="Occupation">
                                                <label for="occupation"><i class="bi bi-briefcase me-2"></i>Occupation</label>
                                            </div>
                                        </div>
                                    </div>

                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Contact Details</h5>
                                    <div class="row g-4 mb-4">
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required pattern="[0-9]{10,15}">
                                                <label for="phone"><i class="bi bi-telephone me-2"></i>Phone Number *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="alternatePhone" placeholder="Alternate Phone">
                                                <label for="alternatePhone"><i class="bi bi-telephone-plus me-2"></i>Alternate Phone</label>
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control" id="email" placeholder="Email Address">
                                                <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                                            </div>
                                        </div>
                                    </div>

                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Address Information</h5>
                                    <div class="row g-4 mb-4">
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="address" placeholder="Address">
                                                <label for="address"><i class="bi bi-geo-alt me-2"></i>Street Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="city" placeholder="City">
                                                <label for="city"><i class="bi bi-building me-2"></i>City</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="state" placeholder="State">
                                                <label for="state"><i class="bi bi-map me-2"></i>State</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="pincode" placeholder="Pincode">
                                                <label for="pincode"><i class="bi bi-postage me-2"></i>Pincode</label>
                                            </div>
                                        </div>
                                    </div>

                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Emergency Details</h5>
                                    <div class="row g-4 mb-4">
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="emergencyContact" placeholder="Contact Name">
                                                <label for="emergencyContact">Emergency Contact Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="emergencyPhone" placeholder="Emergency Phone">
                                                <label for="emergencyPhone">Emergency Phone</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <select class="form-select" id="bloodGroup">
                                                    <option value="">Select</option>
                                                    <option value="A+">A+</option>
                                                    <option value="A-">A-</option>
                                                    <option value="B+">B+</option>
                                                    <option value="B-">B-</option>
                                                    <option value="O+">O+</option>
                                                    <option value="O-">O-</option>
                                                    <option value="AB+">AB+</option>
                                                    <option value="AB-">AB-</option>
                                                </select>
                                                <label for="bloodGroup"><i class="bi bi-droplet-half me-2"></i>Blood Group</label>
                                            </div>
                                        </div>
                                    </div>

                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Optical Information</h5>
                                    <div class="row g-4 mb-5">
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <textarea class="form-control" id="eyeCondition" style="height: 80px;" placeholder="Pre-existing conditions..."></textarea>
                                                <label for="eyeCondition">Eye Conditions / Allergies</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="lensPreference" placeholder="Lens">
                                                <label for="lensPreference">Lens Preference</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="framePreference" placeholder="Frame">
                                                <label for="framePreference">Frame Size/Brand Pref.</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="doctorName" placeholder="Doctor">
                                                <label for="doctorName">Doctor Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-12 mt-4">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" id="status" checked>
                                                <label class="form-check-label fw-bold" for="status">Active Customer</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-end gap-3">
                                        <button type="button" class="btn btn-light px-4 py-2" onclick="window.location.href='customers.html'">Cancel</button>
                                        <button type="submit" id="saveBtn" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">Save Customer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({duration: 800, once: true});</script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/add-customer.js"></script>
</body>
</html>
