<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/forms.css?v=2">
    <style>
        .profile-avatar-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: -75px auto 20px;
        }
        .profile-img-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--card-bg);
            box-shadow: var(--shadow-md);
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-header-bg {
            height: 150px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        .avatar-option {
            transition: all 0.3s ease;
        }
        .avatar-option:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex align-items-center mb-4" data-aos="fade-down">
                    <div>
                        <h2 class="mb-0 fw-bold">My Profile</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Home</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Profile</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-xl-4" data-aos="fade-right">
                        <div class="card text-center p-0 overflow-hidden">
                            <div class="profile-header-bg"></div>
                            
                            <!-- Enhanced Avatar Wrapper -->
                            <div class="profile-avatar-wrapper">
                                <div class="profile-img-container">
                                    <img src="https://picsum.photos/200/200?random=1" id="profileImagePreview" alt="Profile" class="w-100 h-100 object-fit-cover">
                                </div>
                                
                                <div class="dropdown position-absolute" style="bottom: 0; right: 0;">
                                    <button class="btn btn-primary rounded-circle shadow p-0 d-flex align-items-center justify-content-center" type="button" data-bs-toggle="dropdown" style="width: 42px; height: 42px; border: 3px solid var(--card-bg);">
                                        <i class="bi bi-pencil-fill fs-6 text-white"></i>
                                    </button>
                                    <ul class="dropdown-menu shadow-lg border-0 py-2">
                                        <li>
                                            <label for="profileImageInput" class="dropdown-item mb-0" style="cursor: pointer;">
                                                <i class="bi bi-upload me-2 text-primary"></i> Upload Photo
                                            </label>
                                        </li>
                                        <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#avatarModal"><i class="bi bi-person-bounding-box me-2 text-secondary"></i> Choose Avatar</a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item text-danger" href="#" id="removePhotoBtn"><i class="bi bi-trash me-2"></i> Remove Photo</a></li>
                                    </ul>
                                </div>
                                <input type="file" id="profileImageInput" class="d-none" accept="image/*">
                            </div>

                            <div class="card-body pt-0 pb-4">
                                <h4 class="fw-bold mb-1" id="displayFullName">Devanshu Chaudhari</h4>
                                <p class="text-muted mb-3">Store Manager</p>
                                <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill mb-3">Active Account</span>
                                <hr>
                                <ul class="list-unstyled text-start text-muted mb-0">
                                    <li class="mb-2"><i class="bi bi-envelope me-2"></i> <span id="displayEmail">chaudharidevanshu1912@gmail.com</span></li>
                                    <li class="mb-2"><i class="bi bi-telephone me-2"></i> <span id="displayPhone">+91 82382 40028</span></li>
                                    <li class="d-flex justify-content-between align-items-center">
                                        <span><i class="bi bi-geo-alt me-2"></i> <span id="displayLocation" class="text-truncate" style="max-width: 200px; display: inline-block; vertical-align: bottom;">SP Stadium, Navrangpura, Ahmedabad</span></span>
                                        <button class="btn btn-sm p-1 border-0" id="fetchLocationBtn" title="Get Live Location" style="background: rgba(0, 229, 255, 0.1);">
                                            <i class="bi bi-crosshair" style="color: var(--accent-color);"></i>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-xl-8" data-aos="fade-left">
                        <div class="card h-100">
                            <div class="card-header border-bottom px-4 py-3 bg-transparent">
                                <ul class="nav nav-tabs card-header-tabs" id="profileTabs" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active fw-medium" data-bs-toggle="tab" data-bs-target="#editProfile">Edit Details</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link fw-medium" data-bs-toggle="tab" data-bs-target="#changePassword">Security</button>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-body p-4">
                                <div class="tab-content">
                                    <!-- Edit Profile -->
                                    <div class="tab-pane fade show active" id="editProfile">
                                        <form id="profileForm" class="needs-validation" novalidate>
                                            <div class="row g-3 mb-4">
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <input type="text" class="form-control" id="fname" value="Devanshu" required>
                                                        <label for="fname">First Name</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <input type="text" class="form-control" id="lname" value="Chaudhari" required>
                                                        <label for="lname">Last Name</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <input type="email" class="form-control" id="pemail" value="chaudharidevanshu1912@gmail.com" required>
                                                        <label for="pemail">Email Address</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <input type="tel" class="form-control" id="pphone" value="8238240028" required>
                                                        <label for="pphone">Phone Number</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="text-end">
                                                <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">Save Changes</button>
                                            </div>
                                        </form>
                                    </div>
                                    
                                    <!-- Change Password -->
                                    <div class="tab-pane fade" id="changePassword">
                                        <form id="securityForm">
                                            <div class="form-floating mb-3">
                                                <input type="password" class="form-control" id="currentPwd" placeholder=" " required>
                                                <label for="currentPwd">Current Password</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input type="password" class="form-control" id="newPwd" placeholder=" " required>
                                                <label for="newPwd">New Password</label>
                                            </div>
                                            <div class="form-floating mb-4">
                                                <input type="password" class="form-control" id="confirmPwd" placeholder=" " required>
                                                <label for="confirmPwd">Confirm New Password</label>
                                            </div>
                                            <div class="text-end">
                                                <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">Update Password</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
            <!-- Avatar Selection Modal -->
            <div class="modal fade" id="avatarModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content glass">
                        <div class="modal-header border-bottom-0 pb-0">
                            <h5 class="modal-title fw-bold">Select Default Avatar</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center py-4">
                            <div class="d-flex justify-content-center gap-4 flex-wrap">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="avatar-option rounded-circle border border-2 border-secondary bg-light" style="width: 80px; height: 80px; cursor: pointer;" onclick="setAvatar(this.src)" data-bs-dismiss="modal">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="avatar-option rounded-circle border border-2 border-secondary bg-light" style="width: 80px; height: 80px; cursor: pointer;" onclick="setAvatar(this.src)" data-bs-dismiss="modal">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jude" class="avatar-option rounded-circle border border-2 border-secondary bg-light" style="width: 80px; height: 80px; cursor: pointer;" onclick="setAvatar(this.src)" data-bs-dismiss="modal">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nala" class="avatar-option rounded-circle border border-2 border-secondary bg-light" style="width: 80px; height: 80px; cursor: pointer;" onclick="setAvatar(this.src)" data-bs-dismiss="modal">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="footer-container"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({duration: 800, once: true});
        
        // Image Upload & Edit Logic
        const imageInput = document.getElementById('profileImageInput');
        const imagePreview = document.getElementById('profileImagePreview');
        const removeBtn = document.getElementById('removePhotoBtn');
        const defaultAvatar = 'https://api.dicebear.com/7.x/initials/svg?seed=AU&backgroundColor=0f172a&textColor=d4af37';
        
        // Handle File Upload
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.setAttribute('src', e.target.result);
                    showToast('Success', 'Profile photo updated successfully!');
                }
                reader.readAsDataURL(file);
            }
        });
        
        // Handle Avatar Selection
        function setAvatar(src) {
            imagePreview.setAttribute('src', src);
            showToast('Success', 'Avatar updated successfully!');
        }
        
        // Handle Remove Photo
        removeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            imagePreview.setAttribute('src', defaultAvatar);
            showToast('Deleted', 'Profile photo removed. Using default avatar.', 'warning');
        });
        
        // Live Location Logic
        const fetchLocationBtn = document.getElementById('fetchLocationBtn');
        const displayLocation = document.getElementById('displayLocation');

        fetchLocationBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                // Show loading state
                const originalHtml = displayLocation.innerHTML;
                displayLocation.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        try {
                            // Free Reverse Geocoding API
                            const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                            const data = await response.json();
                            const city = data.city || data.locality || "Unknown City";
                            const country = data.countryName || "Unknown Country";
                            
                            displayLocation.textContent = `${city}, ${country}`;
                            showToast('Success', 'Live location synced successfully!');
                        } catch (error) {
                            displayLocation.innerHTML = originalHtml;
                            showToast('Error', 'Failed to resolve location address.', 'danger');
                        }
                    },
                    (error) => {
                        displayLocation.innerHTML = originalHtml;
                        if (error.code === error.PERMISSION_DENIED) {
                            showToast('Error', 'You denied location permissions.', 'danger');
                        } else {
                            showToast('Error', 'Unable to retrieve location.', 'danger');
                        }
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                showToast('Error', 'Geolocation is not supported by your browser.', 'danger');
            }
        });

        // Initialize and persist Profile Details
        document.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem('adminProfile') || '{}');
            const fname = saved.fname || 'Devanshu';
            const lname = saved.lname || 'Chaudhari';
            const email = saved.email || 'chaudharidevanshu1912@gmail.com';
            const phone = saved.phone || '8238240028';
            const location = saved.location || 'SP Stadium, Navrangpura, Ahmedabad';

            if (document.getElementById('fname')) document.getElementById('fname').value = fname;
            if (document.getElementById('lname')) document.getElementById('lname').value = lname;
            if (document.getElementById('pemail')) document.getElementById('pemail').value = email;
            if (document.getElementById('pphone')) document.getElementById('pphone').value = phone;

            if (document.getElementById('displayFullName')) document.getElementById('displayFullName').textContent = `${fname} ${lname}`;
            if (document.getElementById('displayEmail')) document.getElementById('displayEmail').textContent = email;
            if (document.getElementById('displayPhone')) document.getElementById('displayPhone').textContent = `+91 ${phone.replace(/^0+/, '').slice(-10)}`;
            if (document.getElementById('displayLocation')) document.getElementById('displayLocation').textContent = location;
        });

        // Form Submit Logic
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
            
            setTimeout(() => {
                // Get form values
                const fname = document.getElementById('fname').value;
                const lname = document.getElementById('lname').value;
                const email = document.getElementById('pemail').value;
                const phone = document.getElementById('pphone').value;
                const location = document.getElementById('displayLocation').textContent;
                
                // Update Profile Card
                document.getElementById('displayFullName').textContent = `${fname} ${lname}`;
                document.getElementById('displayEmail').textContent = email;
                document.getElementById('displayPhone').textContent = `+91 ${phone.replace(/^0+/, '').slice(-10)}`;
                
                localStorage.setItem('adminProfile', JSON.stringify({ fname, lname, email, phone, location }));

                showToast('Success', 'Profile updated successfully.');
                btn.innerHTML = 'Save Changes';
            }, 800);
        });
        
        document.getElementById('securityForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const currentPwd = document.getElementById('currentPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            
            const storedPassword = localStorage.getItem('adminPassword') || 'password123';
            
            // 0. Verify current password
            if (currentPwd !== storedPassword) {
                showToast('Authentication Failed', 'The current password you entered is incorrect.', 'danger');
                return;
            }
            
            // 1. Prevent reusing the previous password
            if (newPwd === currentPwd) {
                showToast('Security Error', 'Your new password cannot be the same as your current password.', 'danger');
                return;
            }
            
            // 2. Length Validation
            if (newPwd.length < 8) {
                showToast('Weak Password', 'New password must be at least 8 characters long.', 'warning');
                return;
            }
            
            // 3. Complexity Validation
            const hasNumber = /\d/.test(newPwd);
            const hasUpper = /[A-Z]/.test(newPwd);
            if (!hasNumber || !hasUpper) {
                showToast('Weak Password', 'Password must contain at least one uppercase letter and one number.', 'warning');
                return;
            }

            // 4. Match Validation
            if (newPwd !== confirmPwd) {
                showToast('Error', 'New passwords do not match!', 'danger');
                return;
            }

            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Encrypting & Updating...';
            
            setTimeout(() => {
                // Actually save it to local storage so login.html knows about it
                localStorage.setItem('adminPassword', newPwd);
                
                showToast('Success', 'Password changed securely! You will use the new password on your next login.', 'success');
                btn.innerHTML = 'Update Password';
                e.target.reset();
            }, 1500);
        });
    </script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
