<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Virtual Try-On - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        .vto-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            aspect-ratio: 4/3;
        }
        
        #webcamVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
        }
        
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform: scaleX(-1); /* Mirror canvas to match video */
        }
        
        .frame-selector {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 5px;
            scrollbar-width: thin;
        }
        
        .frame-item {
            min-width: 140px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: white;
        }
        
        .frame-item:hover {
            border-color: #0d6efd;
            transform: translateY(-2px);
        }
        
        .frame-item.active {
            border-color: #0d6efd;
            background: #f8fbff;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }
        
        .frame-item img {
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-0 fw-bold"><i class="bi bi-camera-video text-primary me-2"></i>Virtual Try-On Studio</h2>
                        <p class="text-muted mb-0">Real-time AR frame fitting using MediaPipe Face Mesh</p>
                    </div>
                </div>

                <div class="row">
                    <!-- Left: Studio -->
                    <div class="col-lg-7 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                                <h5 class="mb-0 fw-bold">Live Camera Feed</h5>
                                <div>
                                    <button id="btnToggleCamera" class="btn btn-outline-secondary btn-sm"><i class="bi bi-camera-fill me-1"></i>Stop Camera</button>
                                </div>
                            </div>
                            <div class="card-body bg-light">
                                
                                <div class="mb-3">
                                    <label class="form-label fw-medium">Link to Customer Profile</label>
                                    <select class="form-select" id="customerId">
                                        <option value="" selected disabled>Select Customer...</option>
                                    </select>
                                </div>

                                <div class="vto-container mb-4">
                                    <video id="webcamVideo" autoplay playsinline></video>
                                    <canvas id="overlayCanvas"></canvas>
                                    
                                    <div id="loadingOverlay">
                                        <div class="spinner-border text-light mb-3" role="status"></div>
                                        <h5>Initializing AI Face Mesh...</h5>
                                        <p class="small text-white-50">Please allow camera access.</p>
                                    </div>
                                </div>
                                
                                <div class="d-flex gap-2 justify-content-center">
                                    <button id="btnSnapshot" class="btn btn-primary px-4 fw-bold shadow-sm" disabled>
                                        <i class="bi bi-camera me-2"></i>Take Snapshot
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Frame Selection & Result -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0 h-100 mb-4">
                            <div class="card-header bg-white py-3 border-0">
                                <h5 class="mb-0 fw-bold">Select Frame</h5>
                            </div>
                            <div class="card-body">
                                <div class="frame-selector mb-4" id="frameSelector">
                                    <!-- Populated by JS -->
                                    <div class="text-center w-100 text-muted p-3">Loading frames...</div>
                                </div>
                                
                                <hr>
                                
                                <div id="snapshotResultArea" style="display: none;">
                                    <h6 class="fw-bold mb-3">Try-On Snapshot</h6>
                                    <div class="position-relative mb-3 border rounded overflow-hidden shadow-sm">
                                        <img id="snapshotPreview" src="" class="img-fluid w-100" style="transform: scaleX(-1);">
                                    </div>
                                    
                                    <div class="d-grid gap-2">
                                        <button id="btnSaveHistory" class="btn btn-success fw-bold py-2">
                                            <i class="bi bi-cloud-arrow-up-fill me-2"></i>Save to Customer Profile
                                        </button>
                                        <button id="btnRetake" class="btn btn-outline-secondary">
                                            <i class="bi bi-arrow-counterclockwise me-2"></i>Retake Photo
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="waitingSnapshotState" class="text-center py-5 text-muted">
                                    <i class="bi bi-image fs-1 mb-3 opacity-50"></i>
                                    <h5>No Snapshot Taken</h5>
                                    <p>Select a frame and click "Take Snapshot" to capture the look.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>
    
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/vto-engine.js"></script>
</body>
</html>
