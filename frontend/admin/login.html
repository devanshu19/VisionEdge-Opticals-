<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - VisionEdge Opticals</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0A1128 0%, #101F42 45%, #1C2541 75%, #0B132B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            max-width: 440px;
            width: 100%;
            padding: 2.75rem 2.25rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 0 25px rgba(37, 99, 235, 0.2);
            border-top: 5px solid #2563EB;
        }
        
        .login-card .form-control {
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .login-card .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.18);
        }
        
        .text-primary-custom {
            color: #2563EB !important;
        }

        .btn-login-submit {
            background-color: #2563EB !important;
            border: none !important;
            color: #FFFFFF !important;
            font-weight: 700 !important;
            border-radius: 12px !important;
            padding: 14px !important;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4) !important;
            transition: all 0.3s ease !important;
            font-size: 1rem;
        }

        .btn-login-submit:hover {
            background-color: #1D4ED8 !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.6) !important;
        }

        .pass-hint-pill {
            background-color: #F1F5F9;
            color: #475569;
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 1px dashed #CBD5E1;
        }
    </style>
</head>
<body>

    <div class="login-card animate__animated animate__fadeIn">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                <i class="bi bi-shield-lock-fill fs-1 text-primary-custom"></i>
            </div>
            <h3 class="text-primary-custom fw-bold mb-1">
                VisionEdge Admin
            </h3>
            <p class="text-muted small mb-0">Secure Control Center • Password Access Only</p>
        </div>

        <div id="alertContainer"></div>

        <div class="pass-hint-pill">
            <i class="bi bi-key-fill text-primary me-2"></i>
            <span>Admin Passcode: <strong class="text-dark font-monospace">Dev@7272</strong></span>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-4 position-relative">
                <label for="password" class="form-label text-dark fw-semibold small mb-2">
                    <i class="bi bi-lock-fill text-primary me-1"></i> Admin Passcode
                </label>
                <div class="input-group">
                    <input type="password" class="form-control text-dark fw-medium" id="password" placeholder="Enter admin password (Dev@7272)" required autofocus value="Dev@7272">
                    <button type="button" class="btn btn-outline-secondary px-3" id="togglePassword" title="Show / Hide Password">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
                <div class="invalid-feedback" id="passFeedback">Please enter the admin passcode.</div>
            </div>

            <button type="submit" class="btn btn-login-submit w-100 fw-bold shadow-sm mb-3">
                Access Admin Dashboard <i class="bi bi-arrow-right ms-2"></i>
            </button>

            <div class="text-center">
                <a href="../index.html" class="text-muted text-decoration-none small">
                    <i class="bi bi-house me-1"></i> Return to Storefront
                </a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already authenticated as admin, jump straight to dashboard
            try {
                const token = typeof getToken === 'function' ? getToken() : (localStorage.getItem('access_token') || localStorage.getItem('jwtToken'));
                const user = typeof getUser === 'function' ? getUser() : JSON.parse(localStorage.getItem('user') || 'null');
                if (token && user && (user.role || '').toLowerCase() === 'admin') {
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch(e) {}

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === 'true') {
                const alertHtml = `
                    <div class="alert alert-warning alert-dismissible fade show small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Session expired. Please enter passcode again.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>`;
                document.getElementById('alertContainer').innerHTML = alertHtml;
            }
        });

        // Password Visibility Toggle
        document.getElementById('togglePassword').addEventListener('click', function () {
            const password = document.getElementById('password');
            const icon = this.querySelector('i');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('bi-eye-fill');
                icon.classList.add('bi-eye-slash-fill');
            } else {
                password.type = 'password';
                icon.classList.remove('bi-eye-slash-fill');
                icon.classList.add('bi-eye-fill');
            }
        });

        // Form Validation & Submit
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            event.stopPropagation();
            
            const passwordInput = document.getElementById('password');
            const feedback = document.getElementById('passFeedback');
            passwordInput.classList.remove('is-invalid');
            
            const passVal = passwordInput.value.trim();
            if (!passVal) {
                passwordInput.classList.add('is-invalid');
                feedback.textContent = 'Please enter the admin passcode.';
                return;
            }

            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Verifying...';
            btn.disabled = true;
            
            try {
                const apiUrl = window.API_BASE_URL || 'https://visionedge-opticals.onrender.com/api';
                
                // Call dedicated admin-login endpoint
                let response = await fetch(`${apiUrl}/auth/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passVal })
                });

                // Fallback to /login if needed
                if (!response.ok && response.status === 404) {
                    response = await fetch(`${apiUrl}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: 'admin', password: passVal })
                    });
                }
                
                const data = await response.json();
                
                if (response.ok && (data.access_token || data.token)) {
                    const token = data.access_token || data.token;
                    const user = data.user || { role: 'admin', name: 'Admin', username: 'admin' };
                    
                    if (typeof setAuthData === 'function') {
                        setAuthData(token, user, true);
                    } else {
                        localStorage.setItem('access_token', token);
                        localStorage.setItem('jwtToken', token);
                        localStorage.setItem('user', JSON.stringify(user));
                        localStorage.setItem('current_user', JSON.stringify(user));
                    }
                    
                    btn.innerHTML = '<i class="bi bi-check2-circle me-2"></i> Access Granted!';
                    btn.classList.remove('btn-login-submit');
                    btn.classList.add('btn-success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 400);
                } else {
                    passwordInput.classList.add('is-invalid');
                    feedback.textContent = data.message || 'Invalid passcode. Please enter Dev@7272.';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Login error:", error);
                // Offline fallback check: If offline or API network error and user entered Dev@7272, allow emergency session
                if (passVal === 'Dev@7272') {
                    const mockAdmin = { role: 'admin', name: 'Devanshu Admin', username: 'admin' };
                    localStorage.setItem('access_token', 'offline_admin_dev7272');
                    localStorage.setItem('jwtToken', 'offline_admin_dev7272');
                    localStorage.setItem('user', JSON.stringify(mockAdmin));
                    localStorage.setItem('current_user', JSON.stringify(mockAdmin));
                    window.location.href = 'dashboard.html';
                    return;
                }
                passwordInput.classList.add('is-invalid');
                feedback.textContent = 'Server connection error. Please try again.';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
