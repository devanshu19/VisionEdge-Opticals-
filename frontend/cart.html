<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .cart-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            background: #fff;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #f1f5f9;
        }
        .qty-btn {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qty-btn:hover {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>
    
    <main class="container py-5" style="margin-top: 80px;">
        <div class="row mb-4">
            <div class="col-12 text-center" data-aos="fade-down">
                <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-2 rounded-pill mb-2">My Shopping Bag</span>
                <h1 class="fw-bold" style="font-family: 'Outfit', sans-serif;">Shopping Cart</h1>
                <p class="text-muted">Review your selected eyewear, lenses, and frames before checkout.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left: Items List -->
            <div class="col-lg-8" data-aos="fade-up">
                <div class="cart-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                        <h5 class="fw-bold mb-0">Cart Items (<span id="cartItemsCount">0</span>)</h5>
                        <button class="btn btn-outline-danger btn-sm" onclick="clearFullCart()">
                            <i class="bi bi-trash3 me-1"></i> Clear Cart
                        </button>
                    </div>

                    <div id="pageCartList">
                        <!-- Dynamic Cart Items -->
                    </div>
                </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="col-lg-4" data-aos="fade-up" data-aos-delay="100">
                <div class="cart-card p-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-3">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-2 text-muted">
                        <span>Subtotal</span>
                        <span class="fw-semibold text-dark" id="summarySubtotal">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 text-muted">
                        <span>Estimated Shipping</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>GST / Taxes</span>
                        <span class="text-muted">Included</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                        <span>Total Amount</span>
                        <span class="text-primary" id="summaryTotal">₹0</span>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow mb-3" onclick="proceedToCheckout()">
                        Proceed to Checkout <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                    <a href="products.html" class="btn btn-outline-secondary w-100 fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Continue Shopping
                    </a>

                    <div class="mt-4 pt-3 border-top text-center text-muted small">
                        <i class="bi bi-shield-check text-success me-1"></i> 100% Genuine Certified Eyewear &bull; Navrangpura, Ahmedabad
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js?v=1002"></script>
    <script src="assets/js/cart.js?v=1002"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof AOS !== 'undefined') AOS.init({ duration: 600, once: true });
            renderPageCart();
        });

        function renderPageCart() {
            let saved = [];
            try {
                saved = JSON.parse(localStorage.getItem('visionEdgeCart') || '[]');
            } catch(e) { saved = []; }

            const listEl = document.getElementById('pageCartList');
            const countEl = document.getElementById('cartItemsCount');
            const subtotalEl = document.getElementById('summarySubtotal');
            const totalEl = document.getElementById('summaryTotal');

            countEl.textContent = saved.reduce((acc, it) => acc + (it.quantity || 1), 0);

            if (saved.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-bag-x text-muted" style="font-size: 4rem;"></i>
                        <h4 class="fw-bold mt-3">Your cart is empty</h4>
                        <p class="text-muted">Looks like you haven't added any frames or lenses to your bag yet.</p>
                        <a href="products.html" class="btn btn-primary px-4 py-2 mt-2 fw-bold">Explore Eyewear</a>
                    </div>
                `;
                subtotalEl.textContent = '₹0';
                totalEl.textContent = '₹0';
                return;
            }

            let html = '';
            let total = 0;

            saved.forEach((item, idx) => {
                const itemTotal = (item.price || 0) * (item.quantity || 1);
                total += itemTotal;
                const img = item.item_image || item.image || 'assets/images/products/real_1.jpg';

                html += `
                    <div class="d-flex align-items-center justify-content-between p-3 mb-3 border rounded-3 bg-light-subtle">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${img}" class="cart-item-img" alt="${item.name}" onerror="this.src='assets/images/products/real_1.jpg'">
                            <div>
                                <h6 class="fw-bold mb-1">${item.name}</h6>
                                <div class="text-muted small mb-2">₹${item.price} each</div>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="qty-btn" onclick="changeQty(${idx}, -1)">&minus;</button>
                                    <span class="fw-bold px-2">${item.quantity || 1}</span>
                                    <button class="qty-btn" onclick="changeQty(${idx}, 1)">&plus;</button>
                                </div>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold fs-5 text-dark mb-2">₹${itemTotal}</div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${idx}); renderPageCart();">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            listEl.innerHTML = html;
            subtotalEl.textContent = `₹${total}`;
            totalEl.textContent = `₹${total}`;
        }

        window.changeQty = function(idx, delta) {
            let saved = [];
            try {
                saved = JSON.parse(localStorage.getItem('visionEdgeCart') || '[]');
            } catch(e) { return; }

            if (!saved[idx]) return;
            saved[idx].quantity = (saved[idx].quantity || 1) + delta;
            if (saved[idx].quantity <= 0) {
                saved.splice(idx, 1);
            }
            localStorage.setItem('visionEdgeCart', JSON.stringify(saved));
            if (typeof updateCartBadge === 'function') updateCartBadge();
            renderPageCart();
        };

        window.clearFullCart = function() {
            if (confirm("Are you sure you want to clear your cart?")) {
                localStorage.removeItem('visionEdgeCart');
                if (typeof updateCartBadge === 'function') updateCartBadge();
                renderPageCart();
            }
        };
    </script>
</body>
</html>
