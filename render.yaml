services:
  - type: web
    name: visionedge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: APP_ENV
        value: production
      - key: DB_SSLMODE
        value: require
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: RAZORPAY_MODE
        value: test
      - key: FRONTEND_URL
        value: https://visionopticals.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
