<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - VisionEdge Opticals</title>
    <meta name="description" content="View and track all your VisionEdge orders in one place.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { padding-top: 80px; font-family: 'Inter', sans-serif; background: #f1f5f9; }

        .sidebar {
            background: white; border-radius: 16px; padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky; top: 100px;
        }
        .sidebar .avatar-ring {
            width: 70px; height: 70px; border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; font-size: 1.8rem; color: white; font-weight: 700;
        }
        .nav-pills .nav-link {
            color: #64748b; border-radius: 10px; margin-bottom: 4px;
            padding: 10px 14px; font-weight: 500; font-size: .9rem; transition: all .25s;
        }
        .nav-pills .nav-link:hover { background: #eff6ff; color: #2563eb; }
        .nav-pills .nav-link.active { background: linear-gradient(135deg,#2563eb,#1d4ed8); color: white; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
        .nav-pills .nav-link i { width: 22px; text-align: center; margin-right: 8px; }

        /* Order cards */
        .order-card {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: none; margin-bottom: 1.25rem;
            transition: box-shadow .2s, transform .2s;
            overflow: hidden;
        }
        .order-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.1); transform: translateY(-2px); }

        .order-card-header {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #f8faff 0%, #eef2ff 100%);
            border-bottom: 1px solid #e8eef8;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .order-card-body { padding: 1.25rem 1.5rem; }

        .order-number { font-weight: 700; color: #1e293b; font-size: 1rem; }
        .order-date { font-size: .8rem; color: #94a3b8; margin-top: 2px; }

        /* Status badges */
        .status-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 20px;
            font-size: .78rem; font-weight: 600; letter-spacing: .3px;
        }
        .status-pending    { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .status-confirmed  { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .status-processing { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
        .status-ready      { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .status-delivered  { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .status-completed  { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
        .status-cancelled  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        /* Payment status pill */
        .pay-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 600;
        }
        .pay-paid    { background: #dcfce7; color: #166534; }
        .pay-pending { background: #fef3c7; color: #854d0e; }
        .pay-failed  { background: #fee2e2; color: #991b1b; }

        .invoice-badge {
            font-family: 'Courier New', monospace; font-size: .78rem;
            background: #f1f5f9; color: #475569; padding: 3px 10px;
            border-radius: 6px; border: 1px solid #e2e8f0;
        }

        /* Skeleton loader */
        .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        .sk-line { height: 14px; margin-bottom: 8px; }

        /* Empty state */
        .empty-state { text-align: center; padding: 4rem 2rem; }
        .empty-icon { font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem; }

        .summary-bar {
            display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .summary-chip {
            background: white; border-radius: 12px; padding: .6rem 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.05); font-size: .82rem;
            color: #475569; font-weight: 500; display: flex; align-items: center; gap: 6px;
        }
        .summary-chip strong { color: #1e293b; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div class="row g-4">

            <!-- Sidebar -->
            <div class="col-lg-3">
                <div class="sidebar" data-aos="fade-right">
                    <div class="text-center mb-4 pb-4 border-bottom">
                        <div class="avatar-ring" id="sidebarAvatar">U</div>
                        <h6 class="fw-bold mb-0" id="sidebarName">Loading...</h6>
                        <small class="text-muted" id="sidebarEmail"></small>
                    </div>
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="orders.html"><i class="bi bi-box-seam"></i> My Orders</a></li>
                        <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="bi bi-file-medical"></i> Prescriptions</a></li>
                        <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="bi bi-heart"></i> Wishlist</a></li>
                        <li class="nav-item"><a class="nav-link" href="payment-history.html"><i class="bi bi-credit-card"></i> Payment History</a></li>
                        <li class="nav-item mt-3 pt-3 border-top"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Account Settings</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9">
                <div data-aos="fade-up">
                    <h2 class="fw-bold mb-1">My Orders</h2>
                    <p class="text-muted mb-4" style="font-size:.9rem;">Track your purchases and payment status in real time.</p>

                    <!-- Summary chips -->
                    <div class="summary-bar" id="summaryBar" style="display:none!important;">
                        <div class="summary-chip"><i class="bi bi-box-seam text-primary"></i> Total: <strong id="sumTotal">0</strong></div>
                        <div class="summary-chip"><i class="bi bi-clock text-warning"></i> Pending: <strong id="sumPending">0</strong></div>
                        <div class="summary-chip"><i class="bi bi-check-circle text-success"></i> Delivered: <strong id="sumDone">0</strong></div>
                    </div>

                    <!-- Orders container -->
                    <div id="ordersContainer">
                        <!-- Skeleton loaders -->
                        <div class="order-card p-4" id="skeletonCard">
                            <div class="skeleton sk-line" style="width:40%;height:18px;margin-bottom:12px;"></div>
                            <div class="skeleton sk-line" style="width:60%;"></div>
                            <div class="skeleton sk-line" style="width:80%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        AOS.init({ duration: 700, once: true });

        // ── Auth ────────────────────────────────────────────────
        const token = localStorage.getItem('jwtToken') || localStorage.getItem('access_token') || sessionStorage.getItem('jwtToken');
        const userStr = localStorage.getItem('user') || localStorage.getItem('current_user') || sessionStorage.getItem('user');

        if (!token || !userStr) {
            window.location.href = 'login.html?redirect=orders.html';
            return;
        }

        let user = {};
        try { user = JSON.parse(userStr); } catch(e) {}

        // Fill sidebar
        const initials = ((user.first_name || user.name || 'U')[0]).toUpperCase();
        document.getElementById('sidebarAvatar').textContent = initials;
        document.getElementById('sidebarName').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || 'Customer';
        document.getElementById('sidebarEmail').textContent = user.email || '';

        document.getElementById('logoutLink').addEventListener('click', e => {
            e.preventDefault();
            ['jwtToken','access_token','user','current_user','visionEdgeCart','cart'].forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
            window.location.href = 'login.html';
        });

        // ── Fetch Orders ─────────────────────────────────────────
        const apiUrl = window.API_BASE_URL || 'http://127.0.0.1:5000/api';
        const container = document.getElementById('ordersContainer');

        try {
            const res = await fetch(`${apiUrl}/payment/my-orders`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                window.location.href = 'login.html?redirect=orders.html';
                return;
            }

            const orders = await res.json();
            renderOrders(orders);

        } catch(err) {
            container.innerHTML = `
                <div class="order-card p-5 text-center text-danger">
                    <i class="bi bi-wifi-off display-4 d-block mb-3"></i>
                    <h5>Could not load orders</h5>
                    <p class="text-muted">Make sure the backend server is running.</p>
                    <button class="btn btn-outline-primary mt-2" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise me-2"></i>Retry
                    </button>
                </div>`;
        }
    });

    function getStatusBadge(status) {
        const map = {
            'Pending':          { cls: 'status-pending',    icon: 'bi-clock',             label: 'Pending' },
            'Confirmed':        { cls: 'status-confirmed',  icon: 'bi-check2',            label: 'Confirmed' },
            'Processing':       { cls: 'status-processing', icon: 'bi-gear',              label: 'Processing' },
            'Ready for Pickup': { cls: 'status-ready',      icon: 'bi-bag-check',         label: 'Ready for Pickup' },
            'Delivered':        { cls: 'status-delivered',  icon: 'bi-truck',             label: 'Delivered' },
            'Completed':        { cls: 'status-completed',  icon: 'bi-patch-check-fill',  label: 'Completed' },
            'Cancelled':        { cls: 'status-cancelled',  icon: 'bi-x-circle',          label: 'Cancelled' },
        };
        const s = map[status] || { cls: 'status-pending', icon: 'bi-circle', label: status || 'Unknown' };
        return `<span class="status-badge ${s.cls}"><i class="bi ${s.icon}"></i> ${s.label}</span>`;
    }

    function getPayBadge(pstatus) {
        if (!pstatus) return '';
        const cls = pstatus === 'Paid' ? 'pay-paid' : pstatus === 'Failed' ? 'pay-failed' : 'pay-pending';
        const icon = pstatus === 'Paid' ? 'bi-check-circle-fill' : pstatus === 'Failed' ? 'bi-x-circle-fill' : 'bi-hourglass-split';
        return `<span class="pay-badge ${cls}"><i class="bi ${icon}"></i>${pstatus}</span>`;
    }

    function getMethodIcon(method) {
        if (!method) return '<i class="bi bi-cash-stack me-1"></i>';
        const m = method.toLowerCase();
        if (m.includes('payu') || m.includes('card') || m.includes('credit') || m.includes('debit'))
            return '<i class="bi bi-credit-card-2-front text-primary me-1"></i>';
        if (m.includes('upi') || m.includes('bank'))
            return '<i class="bi bi-bank text-info me-1"></i>';
        if (m.includes('cash'))
            return '<i class="bi bi-cash-coin text-success me-1"></i>';
        return '<i class="bi bi-wallet2 text-secondary me-1"></i>';
    }

    function formatDate(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    }

    function formatAmount(amt) {
        if (amt === null || amt === undefined) return '₹0';
        return '₹' + parseFloat(amt).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        const summaryBar = document.getElementById('summaryBar');

        if (!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="empty-state order-card">
                    <div class="empty-icon"><i class="bi bi-box-seam"></i></div>
                    <h4 class="fw-bold text-dark mb-2">No orders yet</h4>
                    <p class="text-muted mb-4">Looks like you haven't placed any orders. Start shopping!</p>
                    <a href="products.html" class="btn btn-primary px-4 rounded-pill fw-bold">
                        <i class="bi bi-shop me-2"></i>Browse Products
                    </a>
                </div>`;
            return;
        }

        // Summary
        const pending = orders.filter(o => o.status === 'Pending').length;
        const done    = orders.filter(o => ['Delivered','Completed'].includes(o.status)).length;
        document.getElementById('sumTotal').textContent   = orders.length;
        document.getElementById('sumPending').textContent = pending;
        document.getElementById('sumDone').textContent    = done;
        summaryBar.style.removeProperty('display');
        summaryBar.style.display = 'flex';

        let html = '';
        orders.forEach((o, idx) => {
            const delay = Math.min(idx * 80, 500);
            html += `
            <div class="order-card" data-aos="fade-up" data-aos-delay="${delay}">
                <div class="order-card-header">
                    <div>
                        <div class="order-number">
                            <i class="bi bi-bag me-1 text-primary"></i>
                            Order #${o.order_number || o.order_id || o.order_id}
                        </div>
                        <div class="order-date"><i class="bi bi-calendar3 me-1"></i>${formatDate(o.created_at)}</div>
                    </div>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        ${getStatusBadge(o.status)}
                        ${getPayBadge(o.payment_status)}
                    </div>
                </div>

                <div class="order-card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-sm-6">
                            <div class="mb-2">
                                <span class="text-muted small"><i class="bi bi-receipt me-1"></i>Invoice</span><br>
                                ${o.invoice_number
                                    ? `<span class="invoice-badge">${o.invoice_number}</span>`
                                    : `<span class="text-muted small">—</span>`}
                            </div>
                            <div>
                                <span class="text-muted small">${getMethodIcon(o.payment_method)}Payment Method</span><br>
                                <span class="fw-semibold text-dark" style="font-size:.88rem;">
                                    ${o.payment_method ? o.payment_method.split('|')[0] : 'Online'}
                                </span>
                            </div>
                        </div>
                        <div class="col-sm-6 text-sm-end">
                            <div class="text-muted small mb-1">Order Total</div>
                            <div class="fw-bold text-primary" style="font-size:1.4rem;">${formatAmount(o.total_amount)}</div>
                        </div>
                    </div>

                    ${o.status === 'Cancelled'
                        ? `<div class="alert alert-danger mt-3 mb-0 py-2 px-3 d-flex align-items-center gap-2" style="font-size:.82rem;border-radius:10px;">
                               <i class="bi bi-x-circle-fill"></i> This order was cancelled.
                           </div>`
                        : o.payment_status === 'Pending'
                        ? `<div class="alert alert-warning mt-3 mb-0 py-2 px-3 d-flex align-items-center gap-2" style="font-size:.82rem;border-radius:10px;">
                               <i class="bi bi-exclamation-triangle-fill"></i> Payment is pending. Please complete your payment.
                               <a href="checkout.html" class="ms-auto btn btn-warning btn-sm fw-bold px-3 py-1 rounded-pill">Pay Now</a>
                           </div>`
                        : ''}

                    <div class="d-flex gap-2 justify-content-end mt-3 pt-3 border-top flex-wrap">
                        ${o.invoice_number
                            ? `<a href="payment-history.html" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-semibold">
                                   <i class="bi bi-receipt me-1"></i>View Invoice
                               </a>`
                            : ''}
                        <a href="products.html" class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold">
                            <i class="bi bi-arrow-repeat me-1"></i>Reorder
                        </a>
                    </div>
                </div>
            </div>`;
        });

        container.innerHTML = html;
        if (typeof AOS !== 'undefined') AOS.refresh();
    }
    </script>
</body>
</html>
