<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Logs - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-0 fw-bold"><i class="bi bi-chat-text text-primary me-2"></i>AI Assistant Logs</h2>
                        <p class="text-muted mb-0">Monitor all AI conversations across the platform</p>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle border">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>User/Staff</th>
                                        <th>Customer Context</th>
                                        <th style="width: 30%">Question</th>
                                        <th style="width: 40%">AI Response</th>
                                    </tr>
                                </thead>
                                <tbody id="chatLogBody">
                                    <tr>
                                        <td colspan="5" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetchWithAuth(`${API_BASE_URL}/chatbot/history`);
                if (response.ok) {
                    const logs = await response.json();
                    const tbody = document.getElementById('chatLogBody');
                    tbody.innerHTML = '';
                    
                    if (logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No AI chat history found.</td></tr>';
                        return;
                    }
                    
                    logs.forEach(log => {
                        const tr = document.createElement('tr');
                        const date = new Date(log.created_at).toLocaleString();
                        const customerContext = log.customer_name ? 
                            `<a href="view-customer.html?id=${log.customer_id}">${log.customer_name}</a>` : 
                            '<span class="text-muted">None</span>';
                            
                        tr.innerHTML = `
                            <td><small class="text-muted">${date}</small></td>
                            <td><span class="badge bg-secondary">${log.username}</span></td>
                            <td>${customerContext}</td>
                            <td><div class="fw-medium text-wrap" style="max-height: 100px; overflow-y: auto;">${log.question}</div></td>
                            <td><div class="text-muted text-wrap" style="max-height: 100px; overflow-y: auto; font-size: 0.9rem;">${log.answer}</div></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error loading chat logs:", error);
                document.getElementById('chatLogBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading history.</td></tr>';
            }
        });
    </script>
</body>
</html>
