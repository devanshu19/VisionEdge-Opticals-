<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Create Account - VisionEdge Opticals</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- VisionEdge CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=9">

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1556761175-4b46a572b786?w=1600&q=80') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }

        .password-toggle-btn {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            border-left: none;
            background-color: #ffffff;
        }
    </style>
</head>

<body>
<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
</div>

<!-- Navbar -->
<div id="navbar-container"></div>

<!-- Background Overlay -->
<div class="auth-overlay"></div>

<!-- Signup Container -->
<div class="container auth-container">
    <div class="auth-card" data-aos="zoom-in">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
            <p class="text-muted small mb-0">Join VisionEdge for smart optical shopping and virtual try-on</p>
        </div>

        <!-- Alert Message Container -->
        <div id="signupMessage" class="alert d-none py-2 small mb-3" role="alert"></div>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)" novalidate>
            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary" for="fullName">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control form-control-lg" id="fullName" placeholder="e.g. Rahul Patel" autocomplete="name" required>
                </div>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-envelope-at"></i></span>
                    <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" autocomplete="email" required>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control form-control-lg" id="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" onclick="togglePasswordVisibility('password', 'pwdEyeIcon')" title="Show or hide password">
                        <i class="bi bi-eye" id="pwdEyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary" for="confirmPassword">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-primary"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control form-control-lg" id="confirmPassword" placeholder="Confirm password" minlength="6" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" onclick="togglePasswordVisibility('confirmPassword', 'confirmPwdEyeIcon')" title="Show or hide password">
                        <i class="bi bi-eye" id="confirmPwdEyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required checked>
                <label class="form-check-label text-muted small fw-medium" for="terms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
            </div>

            <!-- Create Account Button -->
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3 shadow" id="signupBtn">
                <span id="signupBtnText"><i class="bi bi-person-check me-2"></i>Create Account</span>
                <span id="signupSpinner" class="spinner-border spinner-border-sm d-none ms-1" role="status"></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="position-relative text-center my-3">
            <hr class="text-muted">
            <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted bg-white">OR</span>
        </div>

        <!-- Login Link -->
        <p class="text-center text-muted small mb-0">
            Already have an account?
            <a href="login.html" class="fw-bold text-decoration-none text-primary">Sign In</a>
        </p>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS JS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<!-- VisionEdge App & Auth JS -->
<script src="assets/js/api-config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (typeof AOS !== "undefined") {
            AOS.init({ duration: 800, once: true });
        }
    });

    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (!input || !icon) return;

        if (input.type === "password") {
            input.type = "text";
            icon.className = "bi bi-eye-slash";
        } else {
            input.type = "password";
            icon.className = "bi bi-eye";
        }
    }

    function showSignupMessage(msg, type = "danger") {
        const el = document.getElementById("signupMessage");
        el.className = `alert alert-${type} py-2 small mb-3`;
        el.textContent = msg;
        el.classList.remove("d-none");
    }

    function hideSignupMessage() {
        document.getElementById("signupMessage").classList.add("d-none");
    }

    // ==========================================
    // SIMPLE SIGNUP HANDLER
    // ==========================================
    window.handleSignup = async function (e) {
        e.preventDefault();
        hideSignupMessage();

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const terms = document.getElementById("terms").checked;

        if (!fullName) {
            showSignupMessage("Please enter your full name.", "warning");
            return;
        }

        if (!email || !email.includes('@') || !email.includes('.')) {
            showSignupMessage("Please enter a valid email address.", "warning");
            return;
        }

        if (!password) {
            showSignupMessage("Please enter a password.", "warning");
            return;
        }

        if (password.length < 6) {
            showSignupMessage("Password must contain at least 6 characters.", "warning");
            return;
        }

        if (password !== confirmPassword) {
            showSignupMessage("Passwords do not match. Please re-enter your password.", "warning");
            return;
        }

        if (!terms) {
            showSignupMessage("Please agree to the Terms of Service to proceed.", "warning");
            return;
        }

        const btn = document.getElementById("signupBtn");
        const spinner = document.getElementById("signupSpinner");
        const text = document.getElementById("signupBtnText");

        btn.disabled = true;
        spinner.classList.remove("d-none");
        text.innerHTML = "Creating Account...";

        try {
            const apiUrl = window.API_BASE_URL || 'http://127.0.0.1:5000/api';
            const res = await fetch(`${apiUrl}/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    full_name: fullName,
                    email: email,
                    password: password
                })
            });

            const data = await res.json();
            if (!res.ok) {
                showSignupMessage(data.error || data.message || "Registration failed. Please check your details.", "danger");
                return;
            }

            if (data.access_token) {
                if (typeof setAuthData === 'function') {
                    setAuthData(data.access_token, data.user, true);
                } else {
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("jwtToken", data.access_token);
                    localStorage.setItem("current_user", JSON.stringify(data.user));
                    localStorage.setItem("user", JSON.stringify(data.user));
                }

                showSignupMessage("Account created successfully! Welcome to VisionEdge. Redirecting...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 800);
            }
        } catch (err) {
            console.error("Signup network error:", err);
            showSignupMessage("Unable to connect to VisionEdge server. Please make sure the backend is active.", "danger");
        } finally {
            btn.disabled = false;
            spinner.classList.add("d-none");
            text.innerHTML = '<i class="bi bi-person-check me-2"></i>Create Account';
        }
    };
</script>
</body>
</html>
