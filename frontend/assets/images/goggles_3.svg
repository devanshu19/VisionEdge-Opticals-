<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#F8FAFC"/>
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F1F5F9"/>
  </radialGradient>
  <rect width="600" height="400" fill="url(#bgGlow)"/>

  <g transform="translate(100, 110)">
    <!-- Bridge -->
    <path d="M 175 75 Q 200 68 225 75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Left Rectangle Lens Rim -->
    <rect x="65" y="70" width="110" height="85" rx="14" fill="rgba(241, 245, 249, 0.5)" stroke="#94A3B8" stroke-width="5"/>
    <path d="M 65 70 L 175 70" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 80 82 L 130 82" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Rectangle Lens Rim -->
    <rect x="225" y="70" width="110" height="85" rx="14" fill="rgba(241, 245, 249, 0.5)" stroke="#94A3B8" stroke-width="5"/>
    <path d="M 225 70 L 335 70" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 240 82 L 290 82" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>

    <!-- Temples -->
    <path d="M 65 75 L 15 65 Q 0 60 -10 80" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 335 75 L 385 65 Q 400 60 410 80" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <text x="300" y="340" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">Clubmaster Rectangle Titanium Goggles</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Ray-Ban • Ultra Lightweight Metallic Browline</text>
</svg>
