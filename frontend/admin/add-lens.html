<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lens - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-0 fw-bold" id="pageTitle">Add New Lens</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="lenses.html" class="text-decoration-none text-muted">Lenses</a></li>
                                <li class="breadcrumb-item active" id="breadcrumbActive">Add Lens</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body p-4">
                        <form id="lensForm" class="row g-4">
                            <!-- Basic Info -->
                            <div class="col-12">
                                <h5 class="fw-bold mb-3 border-bottom pb-2 text-primary">Basic Information</h5>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Lens Code *</label>
                                <input type="text" class="form-control" id="lCode" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Lens Name *</label>
                                <input type="text" class="form-control" id="lName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Brand</label>
                                <select class="form-select" id="lBrand"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="lCategory"></select>
                            </div>
                            
                            <!-- Specifications -->
                            <div class="col-12 mt-4">
                                <h5 class="fw-bold mb-3 border-bottom pb-2 text-primary">Lens Specifications</h5>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Lens Type</label>
                                <select class="form-select" id="lType">
                                    <option value="">Select Type</option>
                                    <option value="Single Vision">Single Vision</option>
                                    <option value="Bifocal">Bifocal</option>
                                    <option value="Progressive">Progressive</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Material</label>
                                <select class="form-select" id="lMaterial">
                                    <option value="">Select Material</option>
                                    <option value="Glass">Glass</option>
                                    <option value="CR39">CR39</option>
                                    <option value="Polycarbonate">Polycarbonate</option>
                                    <option value="Trivex">Trivex</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Index</label>
                                <select class="form-select" id="lIndex">
                                    <option value="">Select Index</option>
                                    <option value="1.50">1.50 (Standard)</option>
                                    <option value="1.56">1.56 (Mid Index)</option>
                                    <option value="1.61">1.61 (High Index)</option>
                                    <option value="1.67">1.67 (Extra High Index)</option>
                                    <option value="1.74">1.74 (Ultra High Index)</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Coating</label>
                                <input type="text" class="form-control" id="lCoating" placeholder="e.g., ARC, Blue Cut">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Power Range</label>
                                <input type="text" class="form-control" id="lPowerRange" placeholder="e.g., SPH -6.00 to +4.00, CYL -2.00">
                            </div>

                            <!-- Pricing & Stock -->
                            <div class="col-12 mt-4">
                                <h5 class="fw-bold mb-3 border-bottom pb-2 text-primary">Pricing & Inventory</h5>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Purchase Price</label>
                                <input type="number" class="form-control" id="lPurchasePrice" step="0.01" value="0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Selling Price *</label>
                                <input type="number" class="form-control" id="lSellingPrice" step="0.01" required>
                            </div>
                            <div class="col-md-3" id="stockGroup">
                                <label class="form-label">Initial Stock</label>
                                <input type="number" class="form-control" id="lStock" value="0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Minimum Stock Alert</label>
                                <input type="number" class="form-control" id="lMinStock" value="10">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Supplier</label>
                                <select class="form-select" id="lSupplier"></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Location (Drawer/Bin)</label>
                                <input type="text" class="form-control" id="lLocation">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="lStatus">
                                    <option value="Available">Available</option>
                                    <option value="Out of Stock">Out of Stock</option>
                                    <option value="Discontinued">Discontinued</option>
                                </select>
                            </div>
                            
                            <!-- Product Image -->
                            <div class="col-12 mt-4">
                                <h5 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="bi bi-image me-2"></i>Product Image</h5>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Upload Lens Image</label>
                                <input type="file" class="form-control" id="lImageFile" accept="image/*">
                                <small class="text-muted">Select an image file (JPG, PNG, WebP) from your device.</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Image URL / Path</label>
                                <input type="text" class="form-control" id="lImageUrl" placeholder="e.g. /media/products/lens1.jpg or https://...">
                                <small class="text-muted">Auto-filled upon upload, or enter a custom web URL.</small>
                            </div>
                            <div class="col-12 text-center" id="imgPreviewWrapper" style="display: none;">
                                <div class="p-3 border rounded bg-light d-inline-block position-relative">
                                    <p class="small text-muted mb-2">Image Preview</p>
                                    <img id="imgPreview" src="" alt="Lens Image Preview" style="max-height: 180px; max-width: 100%; border-radius: 8px; object-fit: contain;">
                                    <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle" id="removeImgBtn" title="Remove Image"><i class="bi bi-x"></i></button>
                                </div>
                            </div>

                            <!-- Notes -->
                            <div class="col-12 mt-4">
                                <label class="form-label">Notes</label>
                                <textarea class="form-control" id="lNotes" rows="3"></textarea>
                            </div>
                            
                            <div class="col-12 mt-5 text-end border-top pt-4">
                                <a href="lenses.html" class="btn btn-light me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary px-5 shadow-sm">Save Lens</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="footer-container"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/add-lens.js"></script>
</body>
</html>
