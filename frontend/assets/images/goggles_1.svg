<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#F8FAFC"/>
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F1F5F9"/>
  </radialGradient>
  <rect width="600" height="400" fill="url(#bgGlow)"/>
  
  <g transform="translate(110, 100)">
    <!-- Gold Aviator Double Bridge -->
    <path d="M 170 80 Q 190 70 210 80" stroke="#D4AF37" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 165 92 Q 190 85 215 92" stroke="#D4AF37" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Left Aviator Lens -->
    <path d="M 70 85 C 70 85, 120 70, 165 90 C 170 120, 165 170, 125 185 C 80 195, 65 140, 70 85 Z" 
          fill="rgba(30, 41, 59, 0.85)" stroke="#D4AF37" stroke-width="8"/>
    <!-- Left Lens Glare -->
    <path d="M 85 95 C 100 90, 130 85, 145 100 C 130 115, 100 110, 85 95 Z" fill="rgba(255, 255, 255, 0.25)"/>

    <!-- Right Aviator Lens -->
    <path d="M 215 90 C 260 70, 310 85, 310 85 C 315 140, 300 195, 255 185 C 215 170, 210 120, 215 90 Z" 
          fill="rgba(30, 41, 59, 0.85)" stroke="#D4AF37" stroke-width="8"/>
    <!-- Right Lens Glare -->
    <path d="M 230 100 C 245 85, 275 90, 290 95 C 275 110, 245 115, 230 100 Z" fill="rgba(255, 255, 255, 0.25)"/>

    <!-- Temples -->
    <path d="M 70 95 Q 40 85 10 75" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 310 95 Q 340 85 370 75" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Ear Pads -->
    <path d="M 10 75 Q 0 70 -10 90" stroke="#1E293B" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 370 75 Q 380 70 390 90" stroke="#1E293B" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Nose Pads -->
    <ellipse cx="165" cy="115" rx="4" ry="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
    <ellipse cx="215" cy="115" rx="4" ry="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  </g>
  
  <text x="300" y="340" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">Classic Aviator Gold Goggles</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Ray-Ban • Metallic Polarized Series</text>
</svg>
