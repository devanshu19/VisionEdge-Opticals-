<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Prescription - VisionEdge Opticals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <!-- Page Header -->
                <div class="d-flex align-items-center mb-4" data-aos="fade-down">
                    <a href="prescriptions.html" class="btn btn-link text-main p-0 me-3 fs-4"><i class="bi bi-arrow-left"></i></a>
                    <div>
                        <h2 class="mb-0 fw-bold">Edit Prescription</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Home</a></li>
                                <li class="breadcrumb-item"><a href="prescriptions.html" class="text-decoration-none text-muted">Prescriptions</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Edit</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="row" data-aos="fade-up" data-aos-delay="100">
                    <div class="col-12 col-xl-10 mx-auto">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4 p-md-5">
                                <form id="addRxForm" class="needs-validation" novalidate>
                                    
                                    <!-- General -->
                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">General Information</h5>
                                    <div class="row g-4 mb-5">
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <select class="form-select" id="customerId" required>
                                                    <option value="" selected disabled>Loading customers...</option>
                                                </select>
                                                <label for="customerId"><i class="bi bi-person me-2"></i>Select Customer *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="doctorName" placeholder="Doctor Name">
                                                <label for="doctorName"><i class="bi bi-heart-pulse me-2"></i>Doctor / Optometrist</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="date" class="form-control" id="date" required>
                                                <label for="date"><i class="bi bi-calendar-check me-2"></i>Exam Date *</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <input type="date" class="form-control" id="expiryDate">
                                                <label for="expiryDate"><i class="bi bi-calendar-x me-2"></i>Expiry Date</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating">
                                                <select class="form-select" id="status">
                                                    <option value="Draft">Draft</option>
                                                    <option value="Completed" selected>Completed</option>
                                                </select>
                                                <label for="status">Status</label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Right Eye (OD) -->
                                    <h5 class="fw-bold mb-3 text-primary border-bottom pb-2">Right Eye (OD)</h5>
                                    <div class="row g-3 mb-5">
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="od_sph" placeholder="SPH"><label>SPH</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="od_cyl" placeholder="CYL"><label>CYL</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="od_axis" placeholder="AXIS"><label>AXIS</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="od_add" placeholder="ADD"><label>ADD</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="od_prism" placeholder="Prism"><label>PRISM</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="od_base" placeholder="Base"><label>BASE</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="od_va" placeholder="VA"><label>VA</label></div></div>
                                        <div class="col-md-1 col-12"><div class="form-floating"><input type="text" class="form-control" id="od_pd" placeholder="PD"><label>PD</label></div></div>
                                    </div>

                                    <!-- Left Eye (OS) -->
                                    <h5 class="fw-bold mb-3 text-primary border-bottom pb-2">Left Eye (OS)</h5>
                                    <div class="row g-3 mb-5">
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="os_sph" placeholder="SPH"><label>SPH</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="os_cyl" placeholder="CYL"><label>CYL</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="os_axis" placeholder="AXIS"><label>AXIS</label></div></div>
                                        <div class="col-md-2 col-6"><div class="form-floating"><input type="text" class="form-control" id="os_add" placeholder="ADD"><label>ADD</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="os_prism" placeholder="Prism"><label>PRISM</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="os_base" placeholder="Base"><label>BASE</label></div></div>
                                        <div class="col-md-1 col-4"><div class="form-floating"><input type="text" class="form-control" id="os_va" placeholder="VA"><label>VA</label></div></div>
                                        <div class="col-md-1 col-12"><div class="form-floating"><input type="text" class="form-control" id="os_pd" placeholder="PD"><label>PD</label></div></div>
                                    </div>

                                    <!-- Common Properties -->
                                    <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">Recommendations & Setup</h5>
                                    <div class="row g-4 mb-4">
                                        <div class="col-md-3">
                                            <div class="form-floating"><input type="text" class="form-control" id="distance_pd" placeholder="Distance PD"><label>Distance PD</label></div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-floating"><input type="text" class="form-control" id="near_pd" placeholder="Near PD"><label>Near PD</label></div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-floating">
                                                <select class="form-select" id="lensType">
                                                    <option value="">Select...</option>
                                                    <option value="Single Vision">Single Vision</option>
                                                    <option value="Bifocal">Bifocal</option>
                                                    <option value="Progressive">Progressive</option>
                                                </select>
                                                <label>Lens Type</label>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-floating"><input type="text" class="form-control" id="lensMaterial" placeholder="Material"><label>Lens Material</label></div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating"><input type="text" class="form-control" id="lensCoating" placeholder="Coating"><label>Lens Coating</label></div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating"><input type="text" class="form-control" id="frameRecommendation" placeholder="Frame"><label>Frame Recommendation</label></div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <textarea class="form-control" id="notes" style="height: 100px;" placeholder="Additional Notes"></textarea>
                                                <label for="notes">Notes / Remarks</label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- AI Source Tag -->
                                    <input type="hidden" id="source" value="Manual Entry">

                                    <div class="d-flex justify-content-end gap-3 mt-5">
                                        <button type="button" class="btn btn-light px-4 py-2" onclick="window.location.href='prescriptions.html'">Cancel</button>
                                        <button type="submit" id="saveBtn" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">Update Prescription</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({duration: 800, once: true});</script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/edit-prescription.js"></script>
</body>
</html>
