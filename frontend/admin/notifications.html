<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - VisionEdge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .notification-card {
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .notification-card.unread {
            background-color: #f8fbff;
            border-left-color: #0d6efd;
        }
        .notification-card:hover {
            background-color: #f1f5fa;
            cursor: pointer;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="navbar-container"></div>

            <div class="container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-0 fw-bold"><i class="bi bi-bell-fill text-primary me-2"></i>Notification Center</h2>
                        <p class="text-muted mb-0">System alerts, updates, and reminders</p>
                    </div>
                    <div>
                        <button id="dashboardMarkAllBtn" class="btn btn-outline-primary">
                            <i class="bi bi-check-all me-1"></i>Mark All as Read
                        </button>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div id="notificationsList" class="list-group list-group-flush rounded-bottom">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAllNotifications);
        
        async function loadAllNotifications() {
            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/notifications/`);
                if (res.ok) {
                    const list = await res.json();
                    const container = document.getElementById('notificationsList');
                    container.innerHTML = '';
                    
                    if (list.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-5 text-muted">
                                <i class="bi bi-bell-slash fs-1 mb-3 d-block opacity-50"></i>
                                <h5>You're all caught up!</h5>
                                <p>No notifications available.</p>
                            </div>
                        `;
                        return;
                    }
                    
                    list.forEach(notif => {
                        const iconMap = {
                            'LOW_STOCK': { icon: 'bi-box-seam', color: 'bg-danger' },
                            'NEW_ORDER': { icon: 'bi-cart-check', color: 'bg-primary' },
                            'ORDER_READY': { icon: 'bi-check-circle', color: 'bg-success' },
                            'ORDER_COMPLETED': { icon: 'bi-bag-check', color: 'bg-success' },
                            'PAYMENT_PENDING': { icon: 'bi-cash-coin', color: 'bg-warning' },
                            'APPOINTMENT_REMINDER': { icon: 'bi-calendar-event', color: 'bg-info' },
                            'SYSTEM_ALERT': { icon: 'bi-exclamation-triangle', color: 'bg-secondary' }
                        };
                        const styling = iconMap[notif.notification_type] || iconMap['SYSTEM_ALERT'];
                        
                        const date = new Date(notif.created_at).toLocaleString();
                        const isUnread = notif.status === 'Unread';
                        
                        const item = document.createElement('div');
                        item.className = `list-group-item p-4 notification-card ${isUnread ? 'unread' : ''}`;
                        item.onclick = (e) => {
                            if(isUnread) window.markNotifRead(notif.id, e);
                        };
                        
                        item.innerHTML = `
                            <div class="d-flex w-100 align-items-center">
                                <div class="icon-box ${styling.color} text-white shadow-sm me-3 flex-shrink-0">
                                    <i class="bi ${styling.icon} fs-4"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <h6 class="mb-0 fw-bold ${isUnread ? 'text-dark' : 'text-muted'}">${notif.title}</h6>
                                        <small class="text-muted"><i class="bi bi-clock me-1"></i>${date}</small>
                                    </div>
                                    <p class="mb-0 ${isUnread ? 'text-dark' : 'text-muted'}">${notif.message}</p>
                                </div>
                                ${isUnread ? '<span class="badge bg-primary ms-3">New</span>' : ''}
                            </div>
                        `;
                        container.appendChild(item);
                    });
                }
            } catch (e) {
                console.error("Failed to load notifications", e);
                document.getElementById('notificationsList').innerHTML = '<div class="text-center py-5 text-danger">Error loading notifications.</div>';
            }
        }
        
        document.getElementById('dashboardMarkAllBtn').addEventListener('click', async () => {
            try {
                await fetchWithAuth(`${API_BASE_URL}/notifications/read-all`, { method: 'POST' });
                loadAllNotifications();
                if(typeof fetchNotifications === 'function') fetchNotifications();
            } catch(e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
